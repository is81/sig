<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="用药助手" />
    <link rel="manifest" href="manifest.json" />
    <title>💊 用药助手</title>
    <script src="locales/i18n.js"></script>
    <style>
        /* ===== CSS 变量 & 重置 ===== */
        :root {
            --primary: #2A7DE1;
            --primary-light: #E8F0FE;
            --primary-dark: #1A5CA8;
            --success: #2EBB77;
            --success-light: #E6F9F0;
            --danger: #E85C5C;
            --danger-light: #FDEDED;
            --warning: #F5A623;
            --gray: #8E9AAF;
            --gray-light: #F0F2F5;
            --gray-border: #E4E7ED;
            --shadow: 0 2px 16px rgba(42, 125, 225, 0.12);
            --shadow-lg: 0 8px 32px rgba(42, 125, 225, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background: #F7F9FC;
            color: #1A2634;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: calc(80px + var(--safe-bottom));
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 顶部栏 ===== */
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 20px rgba(42, 125, 225, 0.25);
        }
        .app-header .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-header .title {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .app-header .title span {
            font-size: 15px;
        }
        .app-header .date-badge {
            font-size: 12px;
            opacity: 0.85;
            background: rgba(255, 255, 255, 0.18);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }
        .app-header .stats {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 14px;
            opacity: 0.92;
        }
        .app-header .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .app-header .stats .stat-item .num {
            font-weight: 700;
            font-size: 17px;
            background: rgba(255, 255, 255, 0.2);
            padding: 0 8px;
            border-radius: 12px;
            min-width: 24px;
            text-align: center;
        }

        /* ===== 提醒列表 ===== */
        .list-container {
            padding: 16px 16px 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px 40px;
            color: var(--gray);
        }
        .empty-state .icon {
            font-size: 68px;
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            font-size: 20px;
            color: #2D3748;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 15px;
            line-height: 1.6;
            max-width: 280px;
            margin: 0 auto;
        }

        /* ===== 提醒卡片 ===== */
        .reminder-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 16px 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            border-left: 5px solid var(--primary);
            position: relative;
            animation: cardIn 0.3s ease;
        }
        .reminder-card.taken {
            border-left-color: var(--success);
            opacity: 0.7;
        }
        .reminder-card.taken .card-time {
            color: var(--success);
        }
        .reminder-card.overdue {
            border-left-color: var(--danger);
            background: #FFFBFB;
        }
        .reminder-card.overdue .card-time {
            color: var(--danger);
        }
        .reminder-card .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }
        .reminder-card .card-left {
            flex: 1;
            min-width: 0;
        }
        .reminder-card .card-name {
            font-size: 17px;
            font-weight: 700;
            color: #1A2634;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .reminder-card .card-name .drug-icon {
            font-size: 20px;
        }
        .reminder-card .card-dosage {
            font-size: 14px;
            color: var(--gray);
            font-weight: 500;
            margin-top: 1px;
        }
        .reminder-card .card-time {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .reminder-card .card-note {
            font-size: 13px;
            color: var(--gray);
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--gray-border);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .reminder-card .card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .reminder-card .btn-take {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            justify-content: center;
            min-height: 40px;
        }
        .reminder-card .btn-take:active {
            transform: scale(0.96);
        }
        .reminder-card .btn-take.taken-btn {
            background: var(--success-light);
            color: var(--success);
        }
        .reminder-card .btn-take.taken-btn::before {
            content: "✅ ";
        }
        .reminder-card .btn-take:not(.taken-btn)::before {
            content: "⏰ ";
        }
        .reminder-card .btn-delete {
            background: transparent;
            border: none;
            color: var(--gray);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reminder-card .btn-delete:active {
            background: var(--danger-light);
            color: var(--danger);
        }

        .reminder-card .time-tag {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            margin-right: 4px;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 浮动添加按钮 ===== */
        .fab {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            right: 24px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            font-size: 34px;
            font-weight: 300;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .fab:active {
            transform: scale(0.90);
            box-shadow: 0 4px 16px rgba(42, 125, 225, 0.3);
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: overlayIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }

        @keyframes overlayIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 24px 20px calc(20px + var(--safe-bottom));
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.12);
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--gray-light);
        }
        .modal .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1A2634;
        }
        .modal .modal-header .close-btn {
            background: var(--gray-light);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal .modal-header .close-btn:active {
            background: var(--gray-border);
            transform: scale(0.92);
        }

        .modal .form-group {
            margin-bottom: 18px;
        }
        .modal .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2D3748;
            margin-bottom: 5px;
        }
        .modal .form-group label .required {
            color: var(--danger);
        }
        .modal .form-group input,
        .modal .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: var(--font);
            transition: border 0.2s;
            background: #FAFBFC;
            color: #1A2634;
            outline: none;
        }
        .modal .form-group input:focus,
        .modal .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.08);
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 56px;
        }
        .modal .form-group input[type="time"] {
            appearance: none;
            -webkit-appearance: none;
            padding: 10px 12px;
        }

        .modal .time-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .modal .time-item {
            display: flex;
            align-items: center;
            gap: 10px;
            animation: cardIn 0.2s ease;
        }
        .modal .time-item input[type="time"] {
            flex: 1;
        }
        .modal .time-item .remove-time {
            background: var(--danger-light);
            border: none;
            color: var(--danger);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal .time-item .remove-time:active {
            transform: scale(0.90);
            background: var(--danger);
            color: #fff;
        }

        .modal .btn-add-time {
            background: var(--gray-light);
            border: 2px dashed var(--gray-border);
            border-radius: var(--radius-sm);
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray);
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .modal .btn-add-time:active {
            background: var(--gray-border);
            transform: scale(0.98);
        }

        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal .form-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 52px;
        }
        .modal .form-actions .btn-cancel {
            background: var(--gray-light);
            color: var(--gray);
        }
        .modal .form-actions .btn-cancel:active {
            background: var(--gray-border);
        }
        .modal .form-actions .btn-save {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 12px rgba(42, 125, 225, 0.25);
        }
        .modal .form-actions .btn-save:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(42, 125, 225, 0.2);
        }

        /* ===== 页面内通知 ===== */
        .inapp-notification {
            position: fixed;
            bottom: calc(100px + var(--safe-bottom));
            left: 16px;
            right: 16px;
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow-lg);
            border-left: 6px solid var(--warning);
            z-index: 80;
            display: none;
            animation: notifIn 0.4s ease;
            transform-origin: bottom center;
        }
        .inapp-notification.active {
            display: block;
        }
        @keyframes notifIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .inapp-notification .notif-title {
            font-weight: 700;
            font-size: 16px;
            color: #1A2634;
        }
        .inapp-notification .notif-body {
            font-size: 14px;
            color: var(--gray);
            margin: 2px 0 10px;
        }
        .inapp-notification .notif-actions {
            display: flex;
            gap: 10px;
        }
        .inapp-notification .notif-actions button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 38px;
        }
        .inapp-notification .notif-actions .btn-take-now {
            background: var(--success);
            color: #fff;
        }
        .inapp-notification .notif-actions .btn-take-now:active {
            transform: scale(0.96);
        }
        .inapp-notification .notif-actions .btn-dismiss {
            background: var(--gray-light);
            color: var(--gray);
        }
        .inapp-notification .notif-actions .btn-dismiss:active {
            background: var(--gray-border);
        }

        /* ===== 通知权限提示 ===== */
        .perm-banner {
            background: var(--gray-light);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin: 0 16px 12px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            color: #2D3748;
            flex-wrap: wrap;
        }
        .perm-banner .perm-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            min-height: 36px;
        }
        .perm-banner .perm-btn:active {
            transform: scale(0.95);
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .text-muted {
            color: var(--gray);
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-border);
            border-radius: 4px;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 400px) {
            .app-header .title {
                font-size: 19px;
            }
            .app-header .date-badge {
                font-size: 12px;
                padding: 2px 10px;
            }
            .reminder-card .card-name {
                font-size: 15px;
            }
            .reminder-card .card-time {
                font-size: 17px;
            }
            .fab {
                width: 54px;
                height: 54px;
                font-size: 28px;
                right: 18px;
                bottom: calc(18px + var(--safe-bottom));
            }
            .modal {
                padding: 18px 14px calc(14px + var(--safe-bottom));
            }
        }

        @media (min-width: 600px) {
            body {
                background: #EDF2F7;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }
            .app-container {
                max-width: 500px;
                width: 100%;
                background: #F7F9FC;
                min-height: 100vh;
                min-height: 100dvh;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.06);
                position: relative;
            }
            .app-header {
                border-radius: 0 0 24px 24px;
            }
            .fab {
                right: calc(50% - 250px + 24px);
            }
            .inapp-notification {
                left: 50%;
                transform: translateX(-50%);
                bottom: calc(100px + var(--safe-bottom));
                max-width: 440px;
            }
            .inapp-notification.active {
                transform: translateX(-50%) translateY(0);
            }
            @keyframes notifIn {
                from {
                    opacity: 0;
                    transform: translateX(-50%) translateY(30px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0) scale(1);
                }
            }
        }

        /* ===== 暗色模式支持 ===== */
        @media (prefers-color-scheme: dark) {
            :root {
                --gray-light: #2A2F3A;
                --gray-border: #3A3F4A;
                --primary-light: #1A3050;
            }
            body {
                background: #14181F;
                color: #E8EDF2;
            }
            .app-container {
                background: #14181F;
            }
            .app-header {
                background: linear-gradient(135deg, #1A5CA8, #0D3B6E);
            }
            .reminder-card {
                background: #1E232C;
                border-left-color: #3A7BD5;
                box-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
            }
            .reminder-card .card-name {
                color: #E8EDF2;
            }
            .reminder-card .card-note {
                border-top-color: var(--gray-border);
            }
            .reminder-card.taken {
                opacity: 0.6;
            }
            .reminder-card.overdue {
                background: #2A1A1A;
            }
            .modal {
                background: #1E232C;
            }
            .modal .modal-header {
                border-bottom-color: var(--gray-border);
            }
            .modal .modal-header h2 {
                color: #E8EDF2;
            }
            .modal .form-group label {
                color: #C8D0D8;
            }
            .modal .form-group input,
            .modal .form-group textarea {
                background: #14181F;
                border-color: var(--gray-border);
                color: #E8EDF2;
            }
            .modal .form-group input:focus,
            .modal .form-group textarea:focus {
                border-color: var(--primary);
                background: #1A1F28;
            }
            .modal .btn-add-time {
                background: var(--gray-border);
                color: var(--gray);
                border-color: #4A4F5A;
            }
            .modal .form-actions .btn-cancel {
                background: var(--gray-border);
                color: var(--gray);
            }
            .inapp-notification {
                background: #1E232C;
                color: #E8EDF2;
            }
            .inapp-notification .notif-title {
                color: #E8EDF2;
            }
            .inapp-notification .notif-body {
                color: #A8B0B8;
            }
            .perm-banner {
                background: var(--gray-border);
                color: #C8D0D8;
            }
            .empty-state h3 {
                color: #C8D0D8;
            }
            .empty-state p {
                color: var(--gray);
            }
            .fab {
                background: linear-gradient(135deg, #3A7BD5, #1A5CA8);
            }
            .modal .time-item .remove-time {
                background: #3A1A1A;
                color: var(--danger);
            }
            .modal .time-item .remove-time:active {
                background: var(--danger);
                color: #fff;
            }
            .reminder-card .btn-take {
                background: #1A3050;
                color: #6AA8F0;
            }
            .reminder-card .btn-take.taken-btn {
                background: #1A3A2A;
                color: var(--success);
            }
            .reminder-card .time-tag {
                background: #1A3050;
                color: #6AA8F0;
            }
        }
        /* ===== 登录/注册 ===== */
        .auth-container {
            max-width: 400px;
            margin: 40px auto 0;
            padding: 24px 20px;
            display: none;
            position: relative;
        }
        .auth-container.active {
            display: block;
            animation: cardIn 0.35s ease;
        }
        .auth-container .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-container .auth-header .auth-icon {
            font-size: 56px;

        .auth-lang { position: absolute; top: 0; right: 8px; }

        .auth-stats {

            margin-top: 24px;

            margin-right: auto;

        /* 暗色模式 - 登录页 */
        @media (prefers-color-scheme: dark) {
            .auth-container .auth-header h2 {
                color: #E8EDF2;

            .auth-container .auth-form input {

            .auth-container .auth-form input:focus {

            }
        }
    </style>
</head>
<body>

    <!-- ===== 登录/注册 ===== -->
    <div class="auth-container active" id="authContainer">
        <div class="auth-header">
            <span class="auth-icon">💊</span>
            <h2 id="authTitle">登录用药助手</h2>
            <p data-i18n="app.tagline">记录用药，准时提醒</p>
        </div>
        <div class="auth-lang"><select id="langSelect" style="font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid var(--gray-border);background:var(--gray-light);color:inherit;"><option value="zh-CN">🇨🇳 中文</option><option value="en">🇬🇧 English</option><option value="ja">🇯🇵 日本語</option><option value="es">🇪🇸 Español</option></select></div>
        <div class="auth-stats" id="statsText"></div>
        <div class="auth-error" id="authError"></div>
        <form class="auth-form" id="authForm" autocomplete="off">
            <input type="text" id="authUsername" placeholder="" data-i18n-placeholder="auth.username" maxlength="30" autocomplete="username" />
            <input type="password" id="authPassword" placeholder="" data-i18n-placeholder="auth.password" maxlength="64" autocomplete="current-password" />
            <input type="text" id="authDisplayName" placeholder="" data-i18n-placeholder="auth.displayName" maxlength="30" style="display:none;" />
            <button type="submit" class="btn-submit" id="authSubmitBtn">登 录</button>
        </form>
        <div class="auth-switch">
            <span id="authSwitchText">还没有账号？</span> <a id="authSwitchLink" href="#" role="button">立即注册</a>
        </div>
        <div class="auth-disclaimer" id="disclaimerText">
            
        </div>
    </div>

    <div class="app-container hidden" id="app">
        <!-- ===== 顶部 ===== -->
        <header class="app-header">
            <div class="top-row">
                <div class="title"><span>💊</span> <span id="appTitle">用药助手</span></div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div class="date-badge" id="dateBadge">今天</div>
                    <button class="btn-logout" id="logoutBtn">退出</button>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    📋 <span id="labelTotalMeds">今日用药</span> <span class="num" id="totalCount">0</span>
                </div>
                <div class="stat-item">
                    ✅ <span id="labelTaken">已服</span> <span class="num" id="takenCount">0</span>
                </div>
            </div>
        </header>

        <!-- ===== 通知权限提示 ===== -->
        <div class="perm-banner hidden" id="permBanner">
            <span></span>
            <button class="perm-btn" id="permBtn">开启通知</button>
        </div>

        <!-- ===== 提醒列表 ===== -->
        <div class="list-container" id="listContainer">
            <!-- 由 JS 动态渲染 -->
        </div>

        <!-- ===== 浮动添加按钮 ===== -->
        <button class="fab" id="fabBtn" aria-label="添加用药提醒">＋</button>

        <!-- ===== 模态框 ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">添加用药提醒</h2>
                    <button class="close-btn" id="modalCloseBtn">✕</button>
                </div>

                <div class="form-group">
                    <label>💊 药品名称 <span class="required">*</span></label>
                    <input type="text" id="inputName" placeholder="" data-i18n-placeholder="modal.drugPlaceholder" maxlength="30" />
                </div>

                <div class="form-group">
                    <label>📏 剂量</label>
                    <input type="text" id="inputDosage" placeholder="" data-i18n-placeholder="modal.dosagePlaceholder" maxlength="20" />
                </div>

                <div class="form-group">
                    <label>🕐 用药时间 <span class="required">*</span></label>
                    <div class="time-list" id="timeList">
                        <!-- 由 JS 动态生成 -->
                    </div>
                    <button class="btn-add-time" id="addTimeBtn">＋ 添加时间</button>
                </div>

                <div class="form-group">
                    <label>📝 备注</label>
                    <textarea id="inputNote" placeholder="" data-i18n-placeholder="modal.notePlaceholder" maxlength="60" rows="2"></textarea>
                </div>

                <div class="form-actions">
                    <button class="btn-cancel" id="modalCancelBtn">取消</button>
                    <button class="btn-save" id="modalSaveBtn">保存</button>
                </div>
            </div>
        </div>

        <!-- ===== 页面内通知 ===== -->
        <div class="inapp-notification" id="inappNotif">
            <div class="notif-title" id="notifTitle">⏰ 用药提醒</div>
            <div class="notif-body" id="notifBody"></div>
            <div class="notif-actions">
                <button class="btn-take-now" id="notifTakeBtn">✅ 已服用</button>
                <button class="btn-dismiss" id="notifDismissBtn">稍后</button>
            </div>
        </div>
    </div>

    <script>
(function() {
'use strict';

const API_BASE = '/api';

let token = null;
let reminders = [];
let editingId = null;
let notifTimeout = null;
let activeNotifId = null;
let swRegistration = null;
let isLoginMode = true;

const $ = (sel) => document.querySelector(sel);

// Auth
const authContainer = $('#authContainer');
const authTitle = $('#authTitle');
const authError = $('#authError');
const statsText = $('#statsText');
const authForm = $('#authForm');
const authUsername = $('#authUsername');
const authPassword = $('#authPassword');
const authDisplayName = $('#authDisplayName');
const authSubmitBtn = $('#authSubmitBtn');
const authSwitchText = $('#authSwitchText');
const authSwitchLink = $('#authSwitchLink');

// App
const app = $('#app');
const logoutBtn = $('#logoutBtn');
const dateBadge = $('#dateBadge');
const totalCount = $('#totalCount');
const takenCount = $('#takenCount');
const listContainer = $('#listContainer');
const fabBtn = $('#fabBtn');
const modalOverlay = $('#modalOverlay');
const modalCloseBtn = $('#modalCloseBtn');
const modalCancelBtn = $('#modalCancelBtn');
const modalSaveBtn = $('#modalSaveBtn');
const modalTitle = $('#modalTitle');
const inputName = $('#inputName');
const inputDosage = $('#inputDosage');
const inputNote = $('#inputNote');
const timeList = $('#timeList');
const addTimeBtn = $('#addTimeBtn');
const permBanner = $('#permBanner');
const permBtn = $('#permBtn');
const inappNotif = $('#inappNotif');
const notifTitle = $('#notifTitle');
const notifBody = $('#notifBody');
const notifTakeBtn = $('#notifTakeBtn');
const notifDismissBtn = $('#notifDismissBtn');

// ---------- 工具函数 ----------
function getToday() {
    const d = new Date();
    return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
}

function formatDateDisplay() {
    return new Intl.DateTimeFormat(window.i18nCurrent(), {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
    }).format(new Date());
}

function timeToMinutes(str) {
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function timeArg(timeStr) {
    return t('notif.doseTimeArg', { time: timeStr });
}

// ---------- API ----------
async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_BASE + path, { ...options, headers });
    const data = await res.json();
    if (!res.ok) {
        if (res.status === 401) { logout(); throw new Error(t('error.loginExpired')); }
        throw new Error(data.error || t('error.requestFailed'));
    }
    return data;
}

// ---------- 认证 ----------
function idb() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('sig_app', 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('auth')) req.result.createObjectStore('auth'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function saveToken(tok) {
    token = tok;
    localStorage.setItem('sig_token', tok);
    try { const db = await idb(); db.transaction('auth','readwrite').objectStore('auth').put(tok, 'token'); } catch(e) {}
}
function loadToken() { token = localStorage.getItem('sig_token'); return !!token; }

async function logout() {
    token = null;
    localStorage.removeItem('sig_token');
    try { const db = await idb(); db.transaction('auth','readwrite').objectStore('auth').delete('token'); } catch(e) {}
    reminders = [];
    app.classList.add('hidden');
    authContainer.classList.add('active');
    showAuthMode(true);
}

function showAuthMode(isLogin) {
    isLoginMode = isLogin;
    authTitle.textContent = isLogin ? t('auth.loginTitle') : t('auth.registerTitle');
    authSubmitBtn.textContent = isLogin ? t('auth.loginBtn') : t('auth.registerBtn');
    authSubmitBtn.disabled = false;
    authSwitchText.textContent = isLogin ? t('auth.noAccount') : t('auth.hasAccount');
    authSwitchLink.textContent = isLogin ? t('auth.toRegister') : t('auth.toLogin');
    authDisplayName.style.display = isLogin ? 'none' : '';
    authError.classList.remove('active');
    authError.textContent = '';
    authForm.reset();
    // 更新静态文本
    loadStats();
    const disc = document.getElementById('disclaimerText');
    if (disc) disc.textContent = t('disclaimer');
    document.title = t('app.icon') + ' ' + t('app.name');
    ['authUsername','authPassword','authDisplayName'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.placeholder = t(el.dataset.i18nPlaceholder || '');
    });
}

authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = authUsername.value.trim();
    const password = authPassword.value;
    if (!username || !password) { showAuthError(t('auth.fillRequired')); return; }
    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = t('auth.waiting');
    try {
        const path = isLoginMode ? '/auth/login' : '/auth/register';
        const body = { username, password };
        if (!isLoginMode) body.displayName = authDisplayName.value.trim();
        const res = await fetch(API_BASE + path, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) { showAuthError(data.error || t('auth.operationFailed')); authSubmitBtn.disabled = false; authSubmitBtn.textContent = isLoginMode ? t('auth.loginBtn') : t('auth.registerBtn'); return; }
        saveToken(data.token);
        authContainer.classList.remove('active');
        app.classList.remove('hidden');
        await initApp();
    } catch (err) { showAuthError(t('auth.networkError')); authSubmitBtn.disabled = false; authSubmitBtn.textContent = isLoginMode ? t('auth.loginBtn') : t('auth.registerBtn'); }
});

function showAuthError(msg) { authError.textContent = msg; authError.classList.add('active'); }
authSwitchLink.addEventListener('click', (e) => { e.preventDefault(); showAuthMode(!isLoginMode); });
logoutBtn.addEventListener('click', () => { if (confirm(t('auth.logoutConfirm'))) logout(); });

// ---------- Web Push ----------
async function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    try { swRegistration = await navigator.serviceWorker.register('./sw.js'); }
    catch (e) { console.warn('SW reg fail:', e); }
}

async function subscribePush() {
    if (!swRegistration || !('PushManager' in window)) return;
    try {
        const sub = await swRegistration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8('BKkGp6NtPNIQIzeOH7xRg7Mqio69rPGYhwteihB5DKrhnBbpmd-Sfi-qofhA_8GYpJdIJpMWogmQ9Bp6Zyj40Hk'),
        });
        const raw = sub.toJSON();
        await api('/push/subscribe', { method: 'POST', body: JSON.stringify({ endpoint: raw.endpoint, keys: raw.keys }) });
    } catch (e) { console.warn('Push sub fail:', e); }
}

function urlB64ToUint8(base64) {
    const pad = '='.repeat((4 - (base64.length % 4)) % 4);
    const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return new Uint8Array([...raw].map(c => c.charCodeAt(0)));
}

async function requestPushPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') { await subscribePush(); permBanner.classList.add('hidden'); return; }
    if (Notification.permission === 'denied') { permBanner.classList.remove('hidden'); permBtn.textContent = t('perm.denied'); permBtn.disabled = true; return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') { await subscribePush(); permBanner.classList.add('hidden'); }
    else { permBanner.classList.remove('hidden'); }
}

// ---------- 数据加载 ----------
async function loadReminders() {
    const data = await api('/reminders');
    reminders = data.reminders;
    return reminders;
}

// ---------- CRUD ----------
async function addReminder(name, dosage, times, note) {
    const data = await api('/reminders', { method: 'POST', body: JSON.stringify({ name, dosage, times, note }) });
    reminders.unshift(data.reminder);
    render();
}

async function updateReminder(id, name, dosage, times, note) {
    const data = await api('/reminders/' + id, { method: 'PUT', body: JSON.stringify({ name, dosage, times, note }) });
    const idx = reminders.findIndex(r => r.id == id);
    if (idx !== -1) reminders[idx] = data.reminder;
    render();
}

async function deleteReminder(id) {
    await api('/reminders/' + id, { method: 'DELETE' });
    reminders = reminders.filter(r => r.id != id);
    if (activeNotifId) { const stillExists = reminders.some(r => r.times.some(t => t.id == activeNotifId)); if (!stillExists) hideInAppNotification(); }
    render();
}

async function toggleTaken(reminderId, timeId) {
    // 已服用状态下，点"已服用"要确认是否撤销
    const r = reminders.find(rem => rem.id == reminderId);
    const tm = r && r.times.find(t => t.id == timeId);
    if (tm && tm.taken && !confirm(t('reminder.untakeConfirm'))) return;

    const data = await api('/reminders/' + reminderId + '/times/' + timeId + '/toggle', { method: 'PATCH' });
    if (r) { const t = r.times.find(tm2 => tm2.id == timeId); if (t) { t.taken = data.time.taken; t.takenDate = data.time.takenDate; } }
    if (activeNotifId === timeId && data.time.taken) hideInAppNotification();
    render();
}

// ---------- 渲染 ----------
function render() {
    let total = 0, taken = 0;
    reminders.forEach(r => { if (r.times) { r.times.forEach(tm => { total++; if (tm.taken) taken++; }); } });
    totalCount.textContent = total;
    takenCount.textContent = taken;
    dateBadge.textContent = formatDateDisplay();

    if (reminders.length === 0) {
        listContainer.innerHTML = '<div class="empty-state"><span class="icon">' + t('app.icon') + '</span><h3>' + t('empty.title') + '</h3><p>' + t('empty.desc') + '</p></div>';
        return;
    }

    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const items = [];
    reminders.forEach(r => {
        if (r.times) {
            r.times.forEach(tm => {
                const mins = timeToMinutes(tm.time);
                items.push({ reminder: r, time: tm, minutes: mins, isTaken: tm.taken, isOverdue: !tm.taken && mins < currentMinutes });
            });
        }
    });
    items.sort((a, b) => { if (a.minutes !== b.minutes) return a.minutes - b.minutes; return a.reminder.name.localeCompare(b.reminder.name); });

    let html = '';
    items.forEach(item => {
        const r = item.reminder, tm = item.time, isTaken = item.isTaken, isOverdue = item.isOverdue;
        let cardClass = 'reminder-card';
        if (isTaken) cardClass += ' taken';
        if (isOverdue && !isTaken) cardClass += ' overdue';
        const dosageDisplay = r.dosage ? ' · ' + escapeHtml(r.dosage) : '';
        const noteDisplay = r.note ? '📌 ' + escapeHtml(r.note) : '';
        html += '<div class="' + cardClass + '" data-reminder-id="' + r.id + '" data-time-id="' + tm.id + '">' +
            '<div class="card-top"><div class="card-left"><div class="card-name">' +
            '<span class="drug-icon">' + t('app.icon') + '</span>' + escapeHtml(r.name) +
            (dosageDisplay ? '<span class="card-dosage">' + dosageDisplay + '</span>' : '') +
            '</div></div><div class="card-time">' + tm.time + '</div></div>' + // just show time as-is
            (noteDisplay ? '<div class="card-note">' + noteDisplay + '</div>' : '') +
            '<div class="card-actions">' +
            '<button class="btn-take ' + (isTaken ? 'taken-btn' : '') + '" data-action="take">' + (isTaken ? t('reminder.taken') : t('reminder.take')) + '</button>' +
            '<button class="btn-delete" data-action="delete" aria-label="' + t('reminder.delete') + '">🗑</button></div></div>';
    });
    listContainer.innerHTML = html;

    listContainer.querySelectorAll('.reminder-card').forEach(card => {
        const remId = Number(card.dataset.reminderId), timeId = Number(card.dataset.timeId);
        // 点击卡片弹出编辑
        card.addEventListener('click', () => {
            const rem = reminders.find(r => r.id == remId);
            if (rem) openModal(rem);
        });
        card.style.cursor = 'pointer';
        card.querySelector('[data-action="take"]').addEventListener('click', (e) => { e.stopPropagation(); toggleTaken(remId, timeId); });
        card.querySelector('[data-action="delete"]').addEventListener('click', (e) => { e.stopPropagation(); if (confirm(t('reminder.deleteConfirm'))) deleteReminder(remId); });
    });
}

// ---------- 模态框 ----------
function openModal(editData = null) {
    if (editData) {
        editingId = editData.id;
        modalTitle.textContent = t('modal.editTitle');
        inputName.value = editData.name;
        inputDosage.value = editData.dosage || '';
        inputNote.value = editData.note || '';
        renderTimeInputs(editData.times.map(t => t.time));
    } else {
        editingId = null;
        modalTitle.textContent = t('modal.addTitle');
        inputName.value = '';
        inputDosage.value = '';
        inputNote.value = '';
        renderTimeInputs(['08:00', '20:00']);
    }
    modalOverlay.classList.add('active');
    setTimeout(() => inputName.focus(), 100);
}

function closeModal() { modalOverlay.classList.remove('active'); editingId = null; }

function renderTimeInputs(times) {
    if (!times || times.length === 0) times = ['08:00'];
    timeList.innerHTML = '';
    times.forEach(val => {
        const div = document.createElement('div');
        div.className = 'time-item';
        div.innerHTML = '<input type="time" value="' + escapeHtml(val) + '" class="time-input" /><button class="remove-time" ' + (times.length <= 1 ? 'disabled style="opacity:0.3;"' : '') + '>✕</button>';
        timeList.appendChild(div);
        const removeBtn = div.querySelector('.remove-time');
        if (removeBtn && !removeBtn.disabled) {
            removeBtn.addEventListener('click', () => { if (timeList.children.length > 1) div.remove(); });
        }
    });
}

function getTimesFromInputs() {
    const inputs = timeList.querySelectorAll('.time-input');
    const times = [];
    inputs.forEach(inp => { const v = inp.value.trim(); if (v) times.push(v); });
    return [...new Set(times)];
}

async function handleSave() {
    const name = inputName.value.trim();
    if (!name) { alert(t('modal.drugRequired')); inputName.focus(); return; }
    const times = getTimesFromInputs();
    if (times.length === 0) { alert(t('modal.timeRequired')); return; }
    const dosage = inputDosage.value.trim();
    const note = inputNote.value.trim();
    try {
        if (editingId) { await updateReminder(editingId, name, dosage, times, note); }
        else { await addReminder(name, dosage, times, note); }
        closeModal();
    } catch (e) { alert(t('modal.saveError') + e.message); }
}

// ---------- 页面内通知 ----------
function showInAppNotification(title, body, reminderId, timeId) {
    if (activeNotifId === timeId) return;
    notifTitle.textContent = '⏰ ' + title;
    notifBody.textContent = body;
    inappNotif.classList.add('active');
    activeNotifId = timeId;
    inappNotif.dataset.reminderId = reminderId;
    inappNotif.dataset.timeId = timeId;
    if (notifTimeout) clearTimeout(notifTimeout);
}

function hideInAppNotification() {
    inappNotif.classList.remove('active'); activeNotifId = null;
    if (notifTimeout) { clearTimeout(notifTimeout); notifTimeout = null; }
}

// ---------- 轮询检查 ----------
async function checkReminders() {
    try { await loadReminders(); } catch (e) { return; }
    const now = new Date();
    const currentTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    reminders.forEach(r => {
        if (!r.times) return;
        r.times.forEach(tm => {
            if (tm.taken) return;
            if (tm.time === currentTime) {
                if (activeNotifId === tm.id) return;
                const dosage = r.dosage ? ' (' + r.dosage + ')' : '';
                const body = t('notif.doseTime') + dosage + (r.note ? '，' + r.note : '');
                showInAppNotification(t('app.icon') + ' ' + r.name, body, r.id, tm.id);
                if (navigator.vibrate) navigator.vibrate(200);
            }
        });
    });
    render();
}

// ---------- 事件绑定 ----------
notifTakeBtn.addEventListener('click', async () => {
    const remId = Number(inappNotif.dataset.reminderId), timeId = Number(inappNotif.dataset.timeId);
    if (remId && timeId) { try { await toggleTaken(remId, timeId); } catch (e) {} }
    hideInAppNotification();
});
notifDismissBtn.addEventListener('click', () => {
    hideInAppNotification();
    setTimeout(async () => {
        if (activeNotifId) return;
        const remId = Number(inappNotif.dataset.reminderId), timeId = Number(inappNotif.dataset.timeId);
        if (remId && timeId) {
            const r = reminders.find(rem => rem.id == remId);
            if (r) { const t = r.times.find(tm => tm.id == timeId); if (t && !t.taken) { const dosage = r.dosage ? ' (' + r.dosage + ')' : ''; showInAppNotification(t('app.icon') + ' ' + r.name, t('notif.doseTime') + dosage + (r.note ? '，'+r.note : ''), remId, timeId); } }
        }
    }, 5 * 60 * 1000);
});
fabBtn.addEventListener('click', () => openModal());
modalCloseBtn.addEventListener('click', closeModal);
modalCancelBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
modalSaveBtn.addEventListener('click', handleSave);
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && modalOverlay.classList.contains('active') && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); handleSave(); }
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
});
addTimeBtn.addEventListener('click', () => {
    const inputs = timeList.querySelectorAll('.time-input');
    const lastVal = inputs.length > 0 ? inputs[inputs.length - 1].value : '08:00';
    renderTimeInputs([...getTimesFromInputs(), lastVal]);
    const newInputs = timeList.querySelectorAll('.time-input');
    if (newInputs.length > 0) newInputs[newInputs.length - 1].focus();
});
permBtn.addEventListener('click', requestPushPermission);

// 显示推送订阅状态
async function showPushStatus() {
    if (!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { console.warn('❌ SW 未注册'); return; }
    const sub = await reg.pushManager.getSubscription();
    if (sub) { console.log('✅ Push 已订阅'); }
    else { console.warn('❌ Push 未订阅——请从主屏打开并允许通知'); }
}

// ---------- 初始化 ----------
async function initApp() {
    try { await loadReminders(); } catch (e) { console.warn('load fail:', e); reminders = []; }
    render();
    if ('Notification' in window) {
        if (Notification.permission === 'granted') { permBanner.classList.add('hidden'); subscribePush(); }
        else if (Notification.permission === 'denied') { permBanner.classList.remove('hidden'); permBtn.textContent = t('perm.denied'); permBtn.disabled = true; }
        else { permBanner.classList.remove('hidden'); }
    } else { permBanner.classList.add('hidden'); }
    if (window.isSecureContext) showPushStatus();
    setInterval(checkReminders, 30000);
    setInterval(() => { dateBadge.textContent = formatDateDisplay(); }, 60000);
}

// 加载用户数
async function loadStats() {
    try {
        const res = await fetch(API_BASE + '/stats');
        const data = await res.json();
        statsText.textContent = t('stats.users', { n: data.userCount });
    } catch (e) {}
}

async function bootstrap() {
    loadStats();
    await registerSW();
    if (loadToken()) {
        try {
            const data = await api('/reminders');
            reminders = data.reminders;
            authContainer.classList.remove('active');
            app.classList.remove('hidden');
            await initApp();
            return;
        } catch (e) { logout(); }
    }
    authContainer.classList.add('active');
    app.classList.add('hidden');
    showAuthMode(true);
}

// 语言切换时重新渲染
function refreshUI() {
    loadStats();
    showAuthMode(isLoginMode);
    // 静态占位符
    ['authUsername','authPassword','authDisplayName'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.placeholder = t(el.dataset.i18nPlaceholder || '');
    });
    ['inputName','inputDosage','inputNote'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            const key = { inputName: 'modal.drugPlaceholder', inputDosage: 'modal.dosagePlaceholder', inputNote: 'modal.notePlaceholder' }[id];
            if (key && el) el.placeholder = t(key);
        }
    });
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    const disc = document.getElementById('disclaimerText');
    if (disc) disc.textContent = t('disclaimer');
    const permText = document.getElementById('permBanner');
    if (permText && permText.querySelector('span')) permText.querySelector('span').textContent = t('perm.banner');
    const addTime = document.getElementById('addTimeBtn');
    if (addTime) addTime.textContent = t('modal.addTime');
    // Notif static
    const notifTitleEl = document.getElementById('notifTitle');
    if (notifTitleEl) notifTitleEl.textContent = t('notif.title');
    const notifBodyEl = document.getElementById('notifBody');
    if (notifBodyEl) notifBodyEl.textContent = t('notif.body');
    const notifTakeEl = document.getElementById('notifTakeBtn');
    if (notifTakeEl) notifTakeEl.textContent = t('notif.takeNow');
    const notifDismissEl = document.getElementById('notifDismissBtn');
    if (notifDismissEl) notifDismissEl.textContent = t('notif.dismiss');
    const appTitle = document.getElementById('appTitle');
    if (appTitle) appTitle.textContent = t('app.name');
    const logoutBtnEl = document.getElementById('logoutBtn');
    if (logoutBtnEl) logoutBtnEl.textContent = t('auth.logout');
    const labelTotal = document.getElementById('labelTotalMeds');
    if (labelTotal) labelTotal.textContent = t('header.todayMeds');
    const labelTaken = document.getElementById('labelTaken');
    if (labelTaken) labelTaken.textContent = t('header.taken');
    const permBtnEl = document.getElementById('permBtn');
    if (permBtnEl) {
        if ('Notification' in window && Notification.permission === 'denied') permBtnEl.textContent = t('perm.denied');
        else permBtnEl.textContent = t('perm.enable');
    }
    document.title = t('app.icon') + ' ' + t('app.name');
    if (!authContainer.classList.contains('active')) render();
}

// 语言选择器
const langSelect = document.getElementById('langSelect');
if (langSelect) {
    langSelect.value = window.i18nCurrent();
    langSelect.addEventListener('change', async (e) => {
        await window.setLang(e.target.value);
        refreshUI();
    });
}

window.addEventListener('langchange', refreshUI);

// 等待 i18n 就绪再启动
window.i18nReady.then(() => {
    document.title = t('app.icon') + ' ' + t('app.name');
    bootstrap();
});
})();

</script>
