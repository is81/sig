    <!-- ===== 登录/注册 模态框 ===== -->

    <script>
(function() {
'use strict';

const API_BASE = '/api';

let token = null;
let userRole = 'user';
let reminders = [];
let editingId = null;
let notifTimeout = null;
let activeNotifId = null;
let swRegistration = null;
let isLoginMode = true;

const $ = (sel) => document.querySelector(sel);

// Auth
const authOverlay = $('#authOverlay');
const authContainer = $('#authContainer');
const authCloseBtn = $('#authCloseBtn');
const authTitle = $('#authTitle');
const authError = $('#authError');
const statsText = $('#statsText');
const authForm = $('#authForm');
const authUsername = $('#authUsername');
const authPassword = $('#authPassword');
const authSubmitBtn = $('#authSubmitBtn');
const authSwitchText = $('#authSwitchText');
const authSwitchLink = $('#authSwitchLink');

// App
const app = $('#app');
const dateBadge = $('#dateBadge');
const totalCount = $('#totalCount');
const takenCount = $('#takenCount');
const missedCount = $('#missedCount');
const listContainer = $('#listContainer');
const modalOverlay = $('#modalOverlay');
const modalCloseBtn = $('#modalCloseBtn');
const modalCancelBtn = $('#modalCancelBtn');
const modalSaveBtn = $('#modalSaveBtn');
const modalTitle = $('#modalTitle');
const inputName = $('#inputName');
const inputDosage = $('#inputDosage');
const inputNote = $('#inputNote');
const inputGroup = $('#inputGroup');
const inputStartDate = $('#inputStartDate');
const inputEndDate = $('#inputEndDate');
let groups = [];

inputGroup.addEventListener('change', () => {
    const gid = inputGroup.value;
    if (!gid) return;
    const g = groups.find(x => x.id == gid);
    if (g) {
        if (g.startDate && !inputStartDate.value) inputStartDate.value = g.startDate;
        if (g.endDate && !inputEndDate.value) inputEndDate.value = g.endDate;
    }
});

// 剂量结构化输入
const dosageValue = $('#dosageValue');
const dosageUnit = $('#dosageUnit');
const dosageUnitCustom = $('#dosageUnitCustom');
const dosageQty = $('#dosageQty');
const dosageForm = $('#dosageForm');
const dosageFormCustom = $('#dosageFormCustom');

dosageUnit.addEventListener('change', () => {
    dosageUnitCustom.style.display = dosageUnit.value === 'custom' ? '' : 'none';
});
dosageForm.addEventListener('change', () => {
    dosageFormCustom.style.display = dosageForm.value === 'custom' ? '' : 'none';
});

function composeDosage() {
    const val = dosageValue.value.trim();
    if (!val) return '';
    const unit = dosageUnit.value === 'custom' ? dosageUnitCustom.value.trim() : dosageUnit.value;
    const qty = dosageQty.value.trim();
    if (!qty) return val + (unit || '');
    const form = dosageForm.value === 'custom' ? dosageFormCustom.value.trim() : dosageForm.value;
    if (!unit && !form) return val;
    if (!unit) return val + ' × ' + qty + form;
    return val + unit + ' × ' + qty + form;
}

function parseDosage(str) {
    if (!str) return;
    const match = str.match(/^([\d.]+)\s*(\S+?)\s*[×x]\s*(\d+)\s*(\S+)$/);
    if (match) {
        dosageValue.value = match[1];
        const unit = match[2];
        const presetUnits = ['g','mg','µg','ml'];
        if (presetUnits.includes(unit)) { dosageUnit.value = unit; dosageUnitCustom.style.display = 'none'; }
        else { dosageUnit.value = 'custom'; dosageUnitCustom.style.display = ''; dosageUnitCustom.value = unit; }
        dosageQty.value = match[3];
        const form = match[4];
        const presetForms = ['粒','片','包','支','滴'];
        if (presetForms.includes(form)) { dosageForm.value = form; dosageFormCustom.style.display = 'none'; }
        else { dosageForm.value = 'custom'; dosageFormCustom.style.display = ''; dosageFormCustom.value = form; }
    } else {
        // 向后兼容：旧格式整个放入 value
        dosageValue.value = str;
        dosageUnit.value = 'g';
        dosageQty.value = '1';
        dosageForm.value = '粒';
        dosageUnitCustom.style.display = 'none';
        dosageFormCustom.style.display = 'none';
    }
}

function resetDosage() {
    dosageValue.value = '';
    dosageUnit.value = 'g';
    dosageUnitCustom.value = '';
    dosageUnitCustom.style.display = 'none';
    dosageQty.value = '1';
    dosageForm.value = '粒';
    dosageFormCustom.value = '';
    dosageFormCustom.style.display = 'none';
}
const timeList = $('#timeList');
const addTimeBtn = $('#addTimeBtn');
const permBanner = $('#permBanner');
const permBtn = $('#permBtn');
const inappNotif = $('#inappNotif');
const notifTitle = $('#notifTitle');
const notifBody = $('#notifBody');
const notifTakeBtn = $('#notifTakeBtn');
const notifDismissBtn = $('#notifDismissBtn');

// ---------- 工具函数 ----------
function getToday() {
    const d = new Date();
    return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
}

function formatDateDisplay() {
    return new Intl.DateTimeFormat(window.i18nCurrent(), {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
    }).format(new Date());
}

function timeToMinutes(str) {
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
}

function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


// ---------- API ----------
async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_BASE + path, { ...options, headers });
    const data = await res.json();
    if (!res.ok) {
        if (res.status === 401) { logout(); throw new Error(t('error.loginExpired')); }
        throw new Error(data.error || t('error.requestFailed'));
    }
    return data;
}

function idb() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('sig_app', 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('auth')) req.result.createObjectStore('auth'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function saveToken(tok) {

// ---------- Web Push ----------
async function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    try { swRegistration = await navigator.serviceWorker.register('./sw.js'); }
    catch (e) { console.warn('SW reg fail:', e); }
}

async function subscribePush() {
    if (!swRegistration || !('PushManager' in window)) return;
    try {
        const sub = await Promise.race([
            swRegistration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlB64ToUint8('BKkGp6NtPNIQIzeOH7xRg7Mqio69rPGYhwteihB5DKrhnBbpmd-Sfi-qofhA_8GYpJdIJpMWogmQ9Bp6Zyj40Hk'),
            }),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000))
        ]);
        const raw = sub.toJSON();
        await api('/push/subscribe', { method: 'POST', body: JSON.stringify({ endpoint: raw.endpoint, keys: raw.keys }) });
        console.log('✅ Push 订阅成功');
    } catch (e) { console.warn('Push sub fail:', e.message); }
}

function urlB64ToUint8(base64) {
    const pad = '='.repeat((4 - (base64.length % 4)) % 4);
    const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return new Uint8Array([...raw].map(c => c.charCodeAt(0)));
}

async function requestPushPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') { permBanner.classList.add('hidden'); subscribePush(); return; }
    if (Notification.permission === 'denied') { permBanner.classList.remove('hidden'); permBtn.textContent = t('perm.denied'); permBtn.disabled = true; return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') { permBanner.classList.add('hidden'); subscribePush(); }
    else { permBanner.classList.remove('hidden'); }
}

    const data = await api('/reminders/' + reminderId + '/times/' + timeId + '/mark', { method: 'PATCH', body: JSON.stringify({ taken: val }) });

// ---------- 渲染 ----------
function calcStreak(r) {
    const today = new Date(); today.setHours(0,0,0,0);
    let streak = 0;
    for (let i = 1; i <= 30; i++) {
        const d = new Date(today - i * 86400000);
        const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        if (r.times && r.times.length > 0 && r.times.every(t => t.takenDate === ds)) streak++;
        else break;
    }
    return streak;
}

function checkSurveyBanner(activeReminders) {
    const banner = document.getElementById('surveyBanner');
    if (!banner || !token) return;
    const today = new Date().toISOString().slice(0,10);
    const askedKey = 'survey_last_' + today;
    if (localStorage.getItem(askedKey)) return;
    const askedGroups = {}; // 同组只问一次
    for (const r of activeReminders) {
        const gid = r.groupId || ('_single_' + r.id);
        if (askedGroups[gid]) continue;
        const sk = 'survey_grp_' + gid;
        const lastAsked = localStorage.getItem(sk);
        if (lastAsked === today) continue;
        const streak = calcStreak(r);
        if (streak >= 7) {
            const label = r.groupId ? (groups.find(g => g.id == r.groupId)?.name || r.name) : r.name;
            document.getElementById('surveyText').textContent = '📋 ' + (t('feedback.symptomAsk') || '感觉如何？').replace('{name}', label);
            banner.classList.remove('hidden');
            banner.querySelectorAll('.survey-btn').forEach(btn => {
                btn.onclick = async () => {
                    const val = btn.dataset.val;
                    try { await api('/feedback', { method: 'POST', body: JSON.stringify({ reminderId: r.id, type: 'symptom', value: val }) }); } catch(e) {}
                    localStorage.setItem(sk, today);
                    localStorage.setItem(askedKey, '1');
                    banner.classList.add('hidden');
                };
            });
            document.getElementById('surveyClose').onclick = () => {
                localStorage.setItem(sk, today);
                localStorage.setItem(askedKey, '1');
                banner.classList.add('hidden');
            };
            askedGroups[gid] = true;
            return;
        }
    }
}

function isExpired(r) {
    if (!r.endDate) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    return new Date(r.endDate) < today;
}

function render() {
    const activeReminders = reminders.filter(r => !isExpired(r));
    let total = 0, taken = 0, missed = 0;
    activeReminders.forEach(r => { if (r.times) { r.times.forEach(tm => { total++; if (tm.taken === 1) taken++; if (tm.taken === 2) missed++; }); } });
    totalCount.textContent = total;
    takenCount.textContent = taken;
    missedCount.textContent = missed;
    dateBadge.textContent = formatDateDisplay();

    if (activeReminders.length === 0) {
        if (!token) {
            listContainer.innerHTML = '<div class="empty-state"><img src="logo.png" class="icon" style="width:56px;height:56px;border-radius:12px;"><h3>' + t('app.name') + '</h3><p>' + t('action.registerPrompt') + '</p><button id="emptyLoginBtn" style="margin-top:16px;padding:10px 36px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:15px;font-weight:600;letter-spacing:1px;box-shadow:0 3px 12px rgba(42,125,225,0.3);cursor:pointer;transition:all 0.25s">' + t('auth.loginBtn') + '</button><p style="margin-top:12px;font-size:13px;color:var(--gray);">' + t('auth.noAccount') + ' <a href="#" id="emptyRegLink" style="color:var(--primary);text-decoration:none;font-weight:500;">' + t('auth.toRegister') + '</a></p><p id="statsText" style="margin-top:16px;font-size:12px;color:var(--gray);opacity:0.6;"></p></div>';
            const emptyLoginBtn = document.getElementById('emptyLoginBtn');
            const emptyRegLink = document.getElementById('emptyRegLink');
            if (emptyLoginBtn) emptyLoginBtn.addEventListener('click', showAuthModal);
            if (emptyRegLink) emptyRegLink.addEventListener('click', (e) => { e.preventDefault(); showAuthModal(false); });
            loadStats();
        } else {
            listContainer.innerHTML = '<div class="empty-state"><img src="logo.png" class="icon" style="width:56px;height:56px;border-radius:12px;"><h3>' + t('empty.title') + '</h3><p>' + t('empty.desc') + '</p></div>';
        }
        return;
    }

    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const items = [];
    activeReminders.forEach(r => {
        if (r.times) {
            r.times.forEach(tm => {
                const mins = timeToMinutes(tm.time);
                items.push({ reminder: r, time: tm, minutes: mins, isTaken: tm.taken === 1, isMissed: tm.taken === 2, isDone: tm.taken > 0, isOverdue: !tm.taken && mins < currentMinutes });
            });
        }
    });
    items.sort((a, b) => { if (a.isDone !== b.isDone) return a.isDone ? 1 : -1; if (a.isDone) { if (a.minutes !== b.minutes) return b.minutes - a.minutes; } else { if (a.minutes !== b.minutes) return a.minutes - b.minutes; } return a.reminder.name.localeCompare(b.reminder.name); });

    let html = '';
    items.forEach(item => {
        const r = item.reminder, tm = item.time, isTaken = item.isTaken, isMissed = item.isMissed, isOverdue = item.isOverdue;
        let cardClass = 'reminder-card';
        if (isTaken) cardClass += ' taken';
        if (isMissed) cardClass += ' missed';
        if (isOverdue && !isTaken && !isMissed) cardClass += ' overdue';
        const dosageDisplay = r.dosage ? ' · ' + escapeHtml(r.dosage) : '';
        const noteDisplay = r.note ? '📌 ' + escapeHtml(r.note) : '';
        html += '<div class="' + cardClass + '" data-reminder-id="' + r.id + '" data-time-id="' + tm.id + '">' +
            '<div class="card-top"><div class="card-left"><div class="card-name">' +
            '<span class="drug-icon">💊</span>' + escapeHtml(r.name) +
            (dosageDisplay ? '<span class="card-dosage">' + dosageDisplay + '</span>' : '') +
            '</div></div><div class="card-time">' + escapeHtml(tm.time) + '</div></div>' +
            (noteDisplay ? '<div class="card-note">' + noteDisplay + '</div>' : '') +
            '<div class="card-actions">' +
            (isMissed
              ? '<button class="btn-miss missed-btn" data-action="miss">' + t('reminder.miss') + '</button>'
              : '<button class="btn-take ' + (isTaken ? 'taken-btn' : '') + '" data-action="take">' + (isTaken ? t('reminder.taken') : t('reminder.take')) + '</button>' +
                (isTaken ? '' : '<button class="btn-miss" data-action="miss" style="color:#E53E3E;border-color:#E53E3E;">' + t('reminder.missBtn') + '</button>')
            ) +
            '<button class="btn-delete" data-action="delete" aria-label="' + t('reminder.delete') + '">🗑</button></div></div>';
    });
    listContainer.innerHTML = html + '<div style="text-align:center;padding:24px 0 4px;color:var(--gray);font-size:13px;opacity:0.5;">' + t('list.end') + '</div><div style="text-align:center;padding:0 0 12px;color:var(--gray);font-size:10px;opacity:0.3;">v2.0</div>';

    // 7 天症状调查
    checkSurveyBanner(activeReminders);

    listContainer.querySelectorAll('.reminder-card').forEach(card => {
        const remId = Number(card.dataset.reminderId), timeId = Number(card.dataset.timeId);
        // 点击卡片弹出编辑
        card.addEventListener('click', () => {
            const rem = reminders.find(r => r.id == remId);
            if (rem) openModal(rem);
        });
        card.style.cursor = 'pointer';
        const takeBtn = card.querySelector('[data-action="take"]');
        if (takeBtn) takeBtn.addEventListener('click', (e) => { e.stopPropagation(); const cur = reminders.find(r => r.id == remId)?.times?.find(t => t.id == timeId); markTaken(remId, timeId, (cur && cur.taken === 1) ? 0 : 1); });
        const missBtn = card.querySelector('[data-action="miss"]');
        if (missBtn) missBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (missBtn.classList.contains('missed-btn')) {
                if (confirm(t('reminder.unmissConfirm'))) { markTaken(remId, timeId, 0); api('/feedback/' + remId, { method: 'DELETE' }).catch(()=>{}); } // 撤销没吃并删反馈
            } else {
                openMissSheet(remId, timeId);
            }
        });
        card.querySelector('[data-action="delete"]').addEventListener('click', (e) => { e.stopPropagation(); if (confirm(t('reminder.deleteConfirm'))) deleteReminder(remId); });
    });
}

function renderTimeInputs(times) {
    if (!times || times.length === 0) times = ['08:00'];

    times.forEach(val => {
        const div = document.createElement('div');
        div.className = 'time-item';
        div.innerHTML = '<input type="time" value="' + escapeHtml(val) + '" class="time-input" /><button class="remove-time" ' + (times.length <= 1 ? 'disabled style="opacity:0.3;"' : '') + '>✕</button>';
        timeList.appendChild(div);
        const removeBtn = div.querySelector('.remove-time');
        if (removeBtn && !removeBtn.disabled) {
            removeBtn.addEventListener('click', () => { if (timeList.children.length > 1) div.remove(); });
        }
    });

function getTimesFromInputs() {
    const inputs = timeList.querySelectorAll('.time-input');
    const times = [];
    inputs.forEach(inp => { const v = inp.value.trim(); if (v) times.push(v); });
    return [...new Set(times)];
}

async function handleSave() {
    const name = inputName.value.trim();
    if (!name) { alert(t('modal.drugRequired')); inputName.focus(); return; }
    const times = getTimesFromInputs();
    if (times.length === 0) { alert(t('modal.timeRequired')); return; }
    const dosage = composeDosage();
    const note = inputNote.value.trim();
    const groupId = inputGroup.value || null;
    const startDate = inputStartDate.value;
    const endDate = inputEndDate.value;
    try {
        if (editingId) { await updateReminder(editingId, name, dosage, times, note, groupId, startDate, endDate); }
        else { await addReminder(name, dosage, times, note, groupId, startDate, endDate); }
        closeModal();
    } catch (e) { alert(t('modal.saveError') + e.message); }
}

async function checkReminders() {
    try { await loadReminders(); } catch (e) { return; }
    const now = new Date();
    const currentTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    reminders.forEach(r => {
        if (!r.times) return;
        r.times.forEach(tm => {
            if (tm.taken) return;
            if (tm.time === currentTime) {
                if (activeNotifId === tm.id) return;
                const dosage = r.dosage ? ' (' + r.dosage + ')' : '';
                const body = t('notif.doseTime') + dosage + (r.note ? '，' + r.note : '');
                showInAppNotification(r.name, body, r.id, tm.id);
                if (navigator.vibrate) navigator.vibrate(200);
            }
        });
    });
    render();
}

async function openGroups() {

function renderGroupList() {
    if (groups.length === 0) {
        groupsList.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray);">' + t('groups.empty') + '</div>';
        return;
    }
    let html = '';
    groups.forEach(g => {
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-bottom:1px solid var(--gray-border);">';
        html += '<div><strong>' + escapeHtml(g.name) + '</strong> <span style="color:var(--gray);font-size:12px;">(' + t('groups.count', {n: g.medCount}) + ')</span>';
        if (g.startDate || g.endDate) html += '<br><span style="font-size:11px;color:var(--gray);">' + escapeHtml(g.startDate||'?') + ' ~ ' + escapeHtml(g.endDate||'?') + '</span>';
        if (g.note) html += '<br><span style="font-size:11px;color:var(--gray);">' + escapeHtml(g.note) + '</span>';
        html += '</div>';
        html += '<div style="display:flex;gap:4px;">';
        html += '<button onclick="editGroup(' + g.id + ')" style="font-size:12px;padding:2px 8px;border:1px solid var(--gray-border);border-radius:6px;background:none;cursor:pointer;">' + t('groups.edit') + '</button>';
        html += '<button onclick="deleteGroup(' + g.id + ')" style="font-size:12px;padding:2px 8px;border:1px solid var(--danger);color:var(--danger);border-radius:6px;background:none;cursor:pointer;">' + t('groups.delete') + '</button>';
        html += '</div></div>';
    });
    groupsList.innerHTML = html;
}

function showGroupForm(editData = null) {
    if (editData) {
        editingGroupId = editData.id;
        groupName.value = editData.name;
        groupStartDate.value = editData.startDate || '';
        groupEndDate.value = editData.endDate || '';
        groupNote.value = editData.note || '';
        groupFormSave.textContent = t('groups.update');
    } else {
        editingGroupId = null;
        groupName.value = '';
        groupStartDate.value = '';
        groupEndDate.value = '';
        groupNote.value = '';
        groupFormSave.textContent = t('groups.save');
    }
    groupForm.style.display = 'block';
    groupsAddBtn.style.display = 'none';
    setTimeout(() => groupName.focus(), 100);
}

function hideGroupForm() {
    groupForm.style.display = 'none';
    groupsAddBtn.style.display = '';
    editingGroupId = null;
}

groupFormSave.addEventListener('click', async () => {
    const name = groupName.value.trim();
    if (!name) { alert(t('groups.nameRequired')); return; }
    try {
        if (editingGroupId) {
            await api('/groups/' + editingGroupId, { method: 'PUT', body: JSON.stringify({
                name, startDate: groupStartDate.value, endDate: groupEndDate.value, note: groupNote.value.trim()
            })});
        } else {
            await api('/groups', { method: 'POST', body: JSON.stringify({
                name, startDate: groupStartDate.value, endDate: groupEndDate.value, note: groupNote.value.trim()
            })});
        }
        await loadGroups();
        renderGroupList();
        hideGroupForm();
    } catch(e) { alert('保存失败: ' + e.message); }
});

groupFormCancel.addEventListener('click', hideGroupForm);

// ---------- 数据看板 ----------
const dashboardOverlay = document.getElementById('dashboardOverlay');
const dashboardCloseBtn = document.getElementById('dashboardCloseBtn');
const dashboardContent = document.getElementById('dashboardContent');

async function openDashboard() {
    try {
        const res = await fetch(API_BASE + '/admin/stats', { headers: { 'Authorization': 'Bearer ' + token } });
        const s = await res.json();
        let html = '';

        // 用户画像
        html += '<div style="margin-bottom:20px;"><h3 style="font-size:15px;margin-bottom:10px;">👥 用户画像（共 ' + s.totalUsers + ' 人）</h3>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:13px;">';
        if (s.avgBirth) html += '<span style="background:var(--gray-light);padding:4px 12px;border-radius:20px;">📅 平均出生年份: <b>' + s.avgBirth + '</b></span>';
        if (s.genders) s.genders.forEach(g => {
            const label = g.gender === 'male' ? '♂ 男' : g.gender === 'female' ? '♀ 女' : g.gender === 'other' ? '其他' : g.gender;
            const pct = s.totalUsers > 0 ? Math.round(g.cnt / s.totalUsers * 100) : 0;
            html += '<span style="background:var(--gray-light);padding:4px 12px;border-radius:20px;">' + label + ' <b>' + pct + '%</b></span>';
        });
        if (s.regions && s.regions.length > 0) {
            html += '<span style="background:var(--gray-light);padding:4px 12px;border-radius:20px;">📍 ' + s.regions.slice(0,3).map(r => r.region).join(' / ') + '</span>';
        }
        html += '</div></div>';

        // 反馈统计
        const fb = s.feedback;
        if (fb) {
        html += '<div><h3 style="font-size:15px;margin-bottom:10px;">📋 反馈统计（本月）</h3>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:13px;">';

        if (fb.missReasons && fb.missReasons.length > 0) {
            const total = fb.missReasons.reduce((sum, r) => sum + r.cnt, 0);
            html += '<span style="background:var(--gray-light);padding:4px 12px;border-radius:20px;">漏服原因: ';
            html += fb.missReasons.map(r => {
                const label = { forgot: '忘了', sick: '不舒服', noMed: '没带药', noNeed: '不需要了', other: '其他' }[r.value] || r.value;
                return label + ' <b>' + Math.round(r.cnt/total*100) + '%</b>';
            }).join(' | ');
            html += '</span>';
        }
        if (fb.sideEffectCount > 0) html += '<span style="background:var(--gray-light);padding:4px 12px;border-radius:20px;">💊 副作用报告: <b>' + fb.sideEffectCount + '</b> 条</span>';
        if (fb.symptomTotal > 0) html += '<span style="background:var(--gray-light);padding:4px 12px;border-radius:20px;">📈 症状改善率: <b>' + Math.round(fb.symptomBetter / fb.symptomTotal * 100) + '%</b> 感觉好转</span>';
        if (fb.missReasons.length === 0 && fb.sideEffectCount === 0 && fb.symptomTotal === 0) html += '<span style="color:var(--gray);">暂无本月反馈数据</span>';

        html += '</div></div>';
        }
        dashboardContent.innerHTML = html;
        dashboardOverlay.classList.add('active');
    } catch (e) { alert('加载失败: ' + e.message); }
}

// 显示推送订阅状态
async function showPushStatus(silent = true) {
    if (!('serviceWorker' in navigator)) return 'unsupported';
    try {
        const reg = await Promise.race([
            navigator.serviceWorker.getRegistration(),
            new Promise((_, r) => setTimeout(() => r(new Error('t')), 5000))
        ]);
        if (!reg) return 'no_sw';
        const sub = await Promise.race([
            reg.pushManager.getSubscription(),
            new Promise((_, r) => setTimeout(() => r(new Error('t')), 5000))
        ]);
        if (sub) return 'subscribed';
        return 'not_subscribed';
    } catch(e) { return 'timeout'; }
}

async function bootstrap() {
    loadStats();
    await registerSW();
    // 始终显示 app 主界面
    if (loadToken()) {
        userRole = localStorage.getItem('sig_role') || 'user';
        try {
            const data = await api('/reminders');
            reminders = data.reminders;
            if (userRole === 'admin') { if (sheetAdminBtn) sheetAdminBtn.classList.remove('hidden'); if (sheetDashboardBtn) sheetDashboardBtn.classList.remove('hidden'); }
                    await initApp();
            return;
        } catch (e) { logout(); }
    }
    // 未登录：显示空列表
    refreshUI();
    // 监听通知权限（未登录也提示）
    if ('Notification' in window && Notification.permission === 'default') {
        permBanner.classList.remove('hidden');
    }
}

    loadStats();
    showAuthMode(isLoginMode);
    // 静态占位符
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder || '');
    });
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    const disc = document.getElementById('disclaimerText');
    if (disc) disc.textContent = t('disclaimerShort');
    const permText = document.getElementById('permBanner');
    if (permText && permText.querySelector('span')) permText.querySelector('span').textContent = t('perm.banner');
    const addTime = document.getElementById('addTimeBtn');
    if (addTime) addTime.textContent = t('modal.addTime');
    // Notif static
    const notifTitleEl = document.getElementById('notifTitle');
    if (notifTitleEl) notifTitleEl.textContent = t('notif.title');
    const notifBodyEl = document.getElementById('notifBody');
    if (notifBodyEl) notifBodyEl.textContent = t('notif.body');
    const notifTakeEl = document.getElementById('notifTakeBtn');
    if (notifTakeEl) notifTakeEl.textContent = t('notif.takeNow');
    const notifDismissEl = document.getElementById('notifDismissBtn');
    if (notifDismissEl) notifDismissEl.textContent = t('notif.dismiss');
    const appTitle = document.getElementById('appTitle');
    if (appTitle) appTitle.textContent = t('app.name');
    const labelTotal = document.getElementById('labelTotalMeds');
    if (labelTotal) labelTotal.textContent = t('header.todayMeds');
    const labelTaken = document.getElementById('labelTaken');
    if (labelTaken) labelTaken.textContent = t('header.taken');
    const labelMissed = document.getElementById('labelMissed');
    if (labelMissed) labelMissed.textContent = t('header.missed');
    const permBtnEl = document.getElementById('permBtn');
    if (permBtnEl) {
        if ('Notification' in window && Notification.permission === 'denied') permBtnEl.textContent = t('perm.denied');
        else permBtnEl.textContent = t('perm.enable');
    }
    document.title = t('app.name');
    // 语言选择器同步
    if (!authOverlay.classList.contains('active')) render();
}
