<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="吃药啦" />
    <link rel="manifest" href="manifest.json" />
    <title>💊 吃药啦</title>
    <script src="locales/i18n.js"></script>
    <style>
        /* ===== CSS 变量 & 重置 ===== */
        :root {
            --primary: #2A7DE1;
            --primary-light: #E8F0FE;
            --primary-dark: #1A5CA8;
            --success: #2EBB77;
            --success-light: #E6F9F0;
            --danger: #E85C5C;
            --danger-light: #FDEDED;
            --warning: #F5A623;
            --gray: #8E9AAF;
            --gray-light: #F0F2F5;
            --gray-border: #E4E7ED;
            --shadow: 0 2px 16px rgba(42, 125, 225, 0.12);
            --shadow-lg: 0 8px 32px rgba(42, 125, 225, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background: #F7F9FC;
            color: #1A2634;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: calc(80px + var(--safe-bottom));
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 顶部栏 ===== */
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 20px rgba(42, 125, 225, 0.25);
        }
        .app-header .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-header .title {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .app-header .title span {
            font-size: 15px;
        }
        .app-header .date-badge {
            font-size: 12px;
            opacity: 0.85;
            background: rgba(255, 255, 255, 0.18);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }
        .app-header .stats {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 14px;
            opacity: 0.92;
        }
        .app-header .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .app-header .stats .stat-item .num {
            font-weight: 700;
            font-size: 17px;
            background: rgba(255, 255, 255, 0.2);
            padding: 0 8px;
            border-radius: 12px;
            min-width: 24px;
            text-align: center;
        }
        /* 顶部栏大字化 */
        .app-header .title { font-size: 18px; }
        .app-header .title span { font-size: 20px; }
        .app-header .date-badge { font-size: 14px; padding: 4px 12px; }

        /* ===== 底部状态栏 ===== */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--gray-border);
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
            z-index: 60;
            max-width: 500px;
            margin: 0 auto;
        }
        .bottom-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 16px;
            color: var(--gray);
            transition: color 0.2s;
            border-radius: 10px;
            min-width: 56px;
        }
        .bottom-tab span {
            font-size: 10px;
            font-weight: 500;
        }
        .bottom-tab.active {
            color: var(--primary);
        }
        .bottom-tab:active {
            background: rgba(0,0,0,0.05);
        }
        .bottom-tab-add {
            font-size: 28px !important;
            font-weight: 300;
            color: #fff !important;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)) !important;
            border-radius: 50% !important;
            width: 44px;
            height: 44px;
            padding: 0 !important;
            margin-top: -10px;
            box-shadow: 0 3px 12px rgba(42,125,225,0.35);
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        /* ===== 账户操作菜单 ===== */
        .account-sheet {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .account-sheet .sheet-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            animation: overlayIn 0.2s ease;
        }
        .account-sheet .sheet-content {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 16px 16px 0 0;
            padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .sheet-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 8px;
            border: none;
            background: none;
            font-size: 15px;
            cursor: pointer;
            border-radius: 10px;
            color: inherit;
            text-align: left;
        }
        .sheet-item:active { background: rgba(0,0,0,0.06); }
        .sheet-item-danger { color: #E53E3E; }
        .sheet-cancel {
            border-top: 1px solid var(--gray-border);
            margin-top: 4px;
            justify-content: center;
            font-weight: 600;
            color: var(--gray);
        }
        .dark-mode .sheet-content { background: #1E232C; }
        .dark-mode .sheet-item:active { background: rgba(255,255,255,0.06); }

        /* ===== 提醒列表 ===== */
        .list-container {
            padding: 16px 16px 80px;
            max-width: 500px;
            margin: 0 auto;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px 40px;
            color: var(--gray);
        }
        .empty-state .icon {
            display: block;
            margin: 0 auto 16px;
        }
        .empty-state h3 {
            font-size: 20px;
            color: #2D3748;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 15px;
            line-height: 1.6;
            max-width: 280px;
            margin: 0 auto;
        }

        /* ===== 提醒卡片 ===== */
        .reminder-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 16px 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            border-left: 5px solid var(--primary);
            position: relative;
            animation: cardIn 0.3s ease;
        }
        .reminder-card.taken {
            border-left-color: var(--success);
            opacity: 0.7;
        }
        .reminder-card.taken .card-time {
            color: var(--success);
        }
        .reminder-card.overdue {
            border-left-color: var(--danger);
            background: #FFFBFB;
        }
        .reminder-card.overdue .card-time {
            color: var(--danger);
        }
        .reminder-card .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }
        .reminder-card .card-left {
            flex: 1;
            min-width: 0;
        }
        .reminder-card .card-name {
            font-size: 17px;
            font-weight: 700;
            color: #1A2634;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .reminder-card .card-name .drug-icon {
            font-size: 20px;
        }
        .reminder-card .card-dosage {
            font-size: 14px;
            color: var(--gray);
            font-weight: 500;
            margin-top: 1px;
        }
        .reminder-card .card-time {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .reminder-card .card-note {
            font-size: 13px;
            color: var(--gray);
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--gray-border);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .reminder-card .card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .reminder-card .btn-take {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            justify-content: center;
            min-height: 40px;
        }
        .reminder-card .btn-take:active {
            transform: scale(0.96);
        }
        .reminder-card .btn-take.taken-btn {
            background: var(--success-light);
            color: var(--success);
        }
        .reminder-card .btn-take.taken-btn::before {
            content: "✅ ";
        }
        .reminder-card .btn-take:not(.taken-btn)::before {
            content: "⏰ ";
        }
        .reminder-card .btn-delete {
            background: transparent;
            border: none;
            color: var(--gray);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reminder-card .btn-delete:active {
            background: var(--danger-light);
            color: var(--danger);
        }

        .reminder-card .time-tag {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            margin-right: 4px;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 浮动添加按钮 ===== */
        .fab {
            position: fixed;
            bottom: 84px;
            right: 24px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            font-size: 34px;
            font-weight: 300;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 65;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .fab:active {
            transform: scale(0.90);
            box-shadow: 0 4px 16px rgba(42, 125, 225, 0.3);
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: overlayIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }

        @keyframes overlayIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 24px 20px calc(20px + var(--safe-bottom));
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.12);
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--gray-light);
        }
        .modal .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1A2634;
        }
        .modal .modal-header .close-btn {
            background: var(--gray-light);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal .modal-header .close-btn:active {
            background: var(--gray-border);
            transform: scale(0.92);
        }

        .modal .form-group {
            margin-bottom: 18px;
        }
        .modal .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2D3748;
            margin-bottom: 5px;
        }
        .modal .form-group label .required {
            color: var(--danger);
        }
        .modal .form-group input,
        .modal .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: var(--font);
            transition: border 0.2s;
            background: #FAFBFC;
            color: #1A2634;
            outline: none;
        }
        .modal .form-group input:focus,
        .modal .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.08);
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 56px;
        }
        .modal .form-group input[type="time"] {
            appearance: none;
            -webkit-appearance: none;
            padding: 10px 12px;
        }

        .modal .time-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .modal .time-item {
            display: flex;
            align-items: center;
            gap: 10px;
            animation: cardIn 0.2s ease;
        }
        .modal .time-item input[type="time"] {
            flex: 1;
        }
        .modal .time-item .remove-time {
            background: var(--danger-light);
            border: none;
            color: var(--danger);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal .time-item .remove-time:active {
            transform: scale(0.90);
            background: var(--danger);
            color: #fff;
        }

        .modal .btn-add-time {
            background: var(--gray-light);
            border: 2px dashed var(--gray-border);
            border-radius: var(--radius-sm);
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray);
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .modal .btn-add-time:active {
            background: var(--gray-border);
            transform: scale(0.98);
        }

        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal .form-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 52px;
        }
        .modal .form-actions .btn-cancel {
            background: var(--gray-light);
            color: var(--gray);
        }
        .modal .form-actions .btn-cancel:active {
            background: var(--gray-border);
        }
        .modal .form-actions .btn-save {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 12px rgba(42, 125, 225, 0.25);
        }
        .modal .form-actions .btn-save:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(42, 125, 225, 0.2);
        }

        /* ===== 页面内通知 ===== */
        .inapp-notification {
            position: fixed;
            bottom: calc(100px + var(--safe-bottom));
            left: 16px;
            right: 16px;
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow-lg);
            border-left: 6px solid var(--warning);
            z-index: 80;
            display: none;
            animation: notifIn 0.4s ease;
            transform-origin: bottom center;
        }
        .inapp-notification.active {
            display: block;
        }
        @keyframes notifIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .inapp-notification .notif-title {
            font-weight: 700;
            font-size: 16px;
            color: #1A2634;
        }
        .inapp-notification .notif-body {
            font-size: 14px;
            color: var(--gray);
            margin: 2px 0 10px;
        }
        .inapp-notification .notif-actions {
            display: flex;
            gap: 10px;
        }
        .inapp-notification .notif-actions button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 38px;
        }
        .inapp-notification .notif-actions .btn-take-now {
            background: var(--success);
            color: #fff;
        }
        .inapp-notification .notif-actions .btn-take-now:active {
            transform: scale(0.96);
        }
        .inapp-notification .notif-actions .btn-dismiss {
            background: var(--gray-light);
            color: var(--gray);
        }
        .inapp-notification .notif-actions .btn-dismiss:active {
            background: var(--gray-border);
        }

        /* ===== 通知权限提示 ===== */
        .perm-banner {
            background: var(--gray-light);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin: 0 16px 12px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            color: #2D3748;
            flex-wrap: wrap;
        }
        .perm-banner .perm-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            min-height: 36px;
        }
        .perm-banner .perm-btn:active {
            transform: scale(0.95);
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .text-muted {
            color: var(--gray);
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-border);
            border-radius: 4px;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 400px) {
            .app-header .title {
                font-size: 19px;
            }
            .app-header .date-badge {
                font-size: 12px;
                padding: 2px 10px;
            }
            .reminder-card .card-name {
                font-size: 15px;
            }
            .reminder-card .card-time {
                font-size: 17px;
            }
            .fab {
                width: 54px;
                height: 54px;
                font-size: 28px;
                right: 18px;
                bottom: calc(18px + var(--safe-bottom));
            }
            .modal {
                padding: 18px 14px calc(14px + var(--safe-bottom));
            }
        }

        @media (min-width: 600px) {
            body {
                background: #EDF2F7;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }
            .app-container {
                max-width: 500px;
                width: 100%;
                background: #F7F9FC;
                min-height: 100vh;
                min-height: 100dvh;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.06);
                position: relative;
            }
            .app-header {
                border-radius: 0 0 24px 24px;
            }
            .fab {
                right: calc(50% - 250px + 24px);
            }
            .inapp-notification {
                left: 50%;
                transform: translateX(-50%);
                bottom: calc(100px + var(--safe-bottom));
                max-width: 440px;
            }
            .inapp-notification.active {
                transform: translateX(-50%) translateY(0);
            }
            @keyframes notifIn {
                from {
                    opacity: 0;
                    transform: translateX(-50%) translateY(30px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0) scale(1);
                }
            }
        }

        /* ===== 暗色模式支持 ===== */
        @media (prefers-color-scheme: dark) {
            :root {
                --gray-light: #2A2F3A;

        /* ===== 登录/注册 ===== */
        .auth-container {
            max-width: 400px;
            margin: 40px auto 0;
            padding: 24px 20px;
            display: none;
            position: relative;
        }
        .auth-container.active {
            display: block;
            animation: cardIn 0.35s ease;
        }
        .auth-container .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-container .auth-header .auth-icon {
            width: 56px;
            height: 56px;
            display: block;
            margin: 0 auto 8px;
            border-radius: 10px;
        }
        .auth-container .auth-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1A2634;
        }
        .auth-container .auth-header p {
            font-size: 14px;
            color: #5A6270;
            margin-top: 4px;
        }
        .auth-container .close-btn {
            background: rgba(0,0,0,0.15);
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .auth-container .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .auth-container .auth-form input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid var(--gray-border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: var(--font);
            background: #FAFBFC;
            outline: none;
            transition: border 0.2s;
        }
        .auth-container .auth-form input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.08);
        }
        .auth-container .auth-form .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 52px;
            margin-top: 4px;
            box-shadow: 0 4px 18px rgba(42, 125, 225, 0.35);
            position: relative;
            overflow: hidden;
        }
        .auth-container .auth-form .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(42, 125, 225, 0.45);
        }
        .auth-container .auth-form .btn-submit:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(42, 125, 225, 0.25);

        .auth-container .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--gray);

            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .auth-container .auth-error {
            background: var(--danger-light);
            color: var(--danger);
            font-size: 14px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            display: none;
        }
        .auth-container .auth-error.active {
            display: block;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;

        .auth-lang { position: absolute; top: 0; right: 8px; }

            }

                border-color: var(--primary);

</head>
<body>

    <!-- ===== 登录/注册 模态框 ===== -->

    </div>

        <!-- ===== 用药历史弹窗 ===== -->

        <!-- ===== 模态框 ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">添加吃药提醒</h2>
                    <button class="close-btn" id="modalCloseBtn">✕</button>

                <div class="form-group">
                    <label>💊 <span data-i18n="modal.drugName">药品名称</span> <span class="required">*</span></label>

                        <select id="dosageUnit" style="width:68px;padding:8px 4px;border-radius:8px;border:1px solid var(--gray-border);font-size:13px;background:var(--gray-light);color:inherit;">

                            <option value="ml">ml</option><option value="custom" data-i18n="dosage.custom">自定义</option>

                        <input type="text" id="dosageUnitCustom" data-i18n-placeholder="dosage.unit" placeholder="单位" maxlength="5" style="display:none;width:60px;padding:8px;border-radius:8px;border:1px solid var(--gray-border);font-size:14px;background:var(--gray-light);color:inherit;" />

    <script>
(function() {
'use strict';

const API_BASE = '/api';

let token = null;
let userRole = 'user';
let reminders = [];
let editingId = null;
let notifTimeout = null;
let activeNotifId = null;
let swRegistration = null;
let isLoginMode = true;

const $ = (sel) => document.querySelector(sel);

// Auth
const authOverlay = $('#authOverlay');
const authContainer = $('#authContainer');
const authCloseBtn = $('#authCloseBtn');
const authTitle = $('#authTitle');
const authError = $('#authError');
const statsText = $('#statsText');
const authForm = $('#authForm');
const authUsername = $('#authUsername');
const authPassword = $('#authPassword');
const authDisplayName = $('#authDisplayName');
const authSubmitBtn = $('#authSubmitBtn');
const authSwitchText = $('#authSwitchText');
const authSwitchLink = $('#authSwitchLink');

// App
const app = $('#app');
const logoutBtn = $('#logoutBtn');
const dateBadge = $('#dateBadge');
const totalCount = $('#totalCount');
const takenCount = $('#takenCount');
const listContainer = $('#listContainer');
const modalOverlay = $('#modalOverlay');
const modalCloseBtn = $('#modalCloseBtn');
const modalCancelBtn = $('#modalCancelBtn');
const modalSaveBtn = $('#modalSaveBtn');
const modalTitle = $('#modalTitle');
const inputName = $('#inputName');
const inputDosage = $('#inputDosage');
const inputNote = $('#inputNote');
const inputGroup = $('#inputGroup');
const inputStartDate = $('#inputStartDate');
const inputEndDate = $('#inputEndDate');
let groups = [];

inputGroup.addEventListener('change', () => {
    const gid = inputGroup.value;
    if (!gid) return;
    const g = groups.find(x => x.id == gid);
    if (g) {
        if (g.startDate && !inputStartDate.value) inputStartDate.value = g.startDate;
        if (g.endDate && !inputEndDate.value) inputEndDate.value = g.endDate;
    }
});

// 剂量结构化输入
const dosageValue = $('#dosageValue');
const dosageUnit = $('#dosageUnit');
const dosageUnitCustom = $('#dosageUnitCustom');
const dosageQty = $('#dosageQty');
const dosageForm = $('#dosageForm');
const dosageFormCustom = $('#dosageFormCustom');

dosageUnit.addEventListener('change', () => {
    dosageUnitCustom.style.display = dosageUnit.value === 'custom' ? '' : 'none';
});
dosageForm.addEventListener('change', () => {
    dosageFormCustom.style.display = dosageForm.value === 'custom' ? '' : 'none';
});

function composeDosage() {
    const val = dosageValue.value.trim();
    if (!val) return '';
    const unit = dosageUnit.value === 'custom' ? dosageUnitCustom.value.trim() : dosageUnit.value;
    const qty = dosageQty.value.trim();
    if (!qty) return val + (unit || '');
    const form = dosageForm.value === 'custom' ? dosageFormCustom.value.trim() : dosageForm.value;
    if (!unit && !form) return val;
    if (!unit) return val + ' × ' + qty + form;
    return val + unit + ' × ' + qty + form;
}

function parseDosage(str) {
    if (!str) return;
    const match = str.match(/^([\d.]+)\s*(\S+?)\s*[×x]\s*(\d+)\s*(\S+)$/);
    if (match) {
        dosageValue.value = match[1];
        const unit = match[2];
        const presetUnits = ['g','mg','µg','ml'];
        if (presetUnits.includes(unit)) { dosageUnit.value = unit; dosageUnitCustom.style.display = 'none'; }
        else { dosageUnit.value = 'custom'; dosageUnitCustom.style.display = ''; dosageUnitCustom.value = unit; }
        dosageQty.value = match[3];
        const form = match[4];
        const presetForms = ['粒','片','包','支','滴'];
        if (presetForms.includes(form)) { dosageForm.value = form; dosageFormCustom.style.display = 'none'; }
        else { dosageForm.value = 'custom'; dosageFormCustom.style.display = ''; dosageFormCustom.value = form; }
    } else {
        // 向后兼容：旧格式整个放入 value
        dosageValue.value = str;
        dosageUnit.value = 'g';
        dosageQty.value = '1';
        dosageForm.value = '粒';
        dosageUnitCustom.style.display = 'none';
        dosageFormCustom.style.display = 'none';
    }
}

function resetDosage() {
    dosageValue.value = '';
    dosageUnit.value = 'g';
    dosageUnitCustom.value = '';
    dosageUnitCustom.style.display = 'none';
    dosageQty.value = '1';
    dosageForm.value = '粒';
    dosageFormCustom.value = '';
    dosageFormCustom.style.display = 'none';
}

// ---------- 工具函数 ----------
function getToday() {
    const d = new Date();
    return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
}

function formatDateDisplay() {
    return new Intl.DateTimeFormat(window.i18nCurrent(), {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
    }).format(new Date());
}

function timeToMinutes(str) {
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
}

function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeArg(timeStr) {
    return t('notif.doseTimeArg', { time: timeStr });
}

// ---------- API ----------
async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_BASE + path, { ...options, headers });
    const data = await res.json();
    if (!res.ok) {
        if (res.status === 401) { logout(); throw new Error(t('error.loginExpired')); }
        throw new Error(data.error || t('error.requestFailed'));
    }
    return data;
}

// ---------- 认证 ----------
function idb() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('sig_app', 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('auth')) req.result.createObjectStore('auth'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function saveToken(tok) {
    token = tok;
    localStorage.setItem('sig_token', tok);
    try { const db = await idb(); db.transaction('auth','readwrite').objectStore('auth').put(tok, 'token'); } catch(e) {}
}
function loadToken() { token = localStorage.getItem('sig_token'); return !!token; }

async function logout() {
    token = null;
    userRole = 'user';
    localStorage.removeItem('sig_token');
    localStorage.removeItem('sig_role');
    if (sheetAdminBtn) sheetAdminBtn.classList.add('hidden');
    try { const db = await idb(); db.transaction('auth','readwrite').objectStore('auth').delete('token'); } catch(e) {}
    reminders = [];
    hideAuthModal();
    updateBottomBarAuth();
    render();
}

authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = authUsername.value.trim();
    const password = authPassword.value;
    if (!username || !password) { showAuthError(t('auth.fillRequired')); return; }
    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = t('auth.waiting');
    try {
        const path = isLoginMode ? '/auth/login' : '/auth/register';
        const body = { username, password };
        if (!isLoginMode) body.displayName = authDisplayName.value.trim();
        const res = await fetch(API_BASE + path, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) { showAuthError(data.error || t('auth.operationFailed')); authSubmitBtn.disabled = false; authSubmitBtn.textContent = isLoginMode ? t('auth.loginBtn') : t('auth.registerBtn'); return; }
        saveToken(data.token);
        userRole = data.role || 'user';
        localStorage.setItem('sig_role', userRole);
        hideAuthModal();
        if (userRole === 'admin') { if (sheetAdminBtn) sheetAdminBtn.classList.remove('hidden'); }
        updateBottomBarAuth();
        await loadReminders();
        await initApp();
    } catch (err) { showAuthError(t('auth.networkError')); authSubmitBtn.disabled = false; authSubmitBtn.textContent = isLoginMode ? t('auth.loginBtn') : t('auth.registerBtn'); }
});

function showAuthError(msg) { authError.textContent = msg; authError.classList.add('active'); }
authSwitchLink.addEventListener('click', (e) => { e.preventDefault(); showAuthMode(!isLoginMode); });

// ---------- Web Push ----------
async function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    try { swRegistration = await navigator.serviceWorker.register('./sw.js'); }
    catch (e) { console.warn('SW reg fail:', e); }
}

async function subscribePush() {
    if (!swRegistration || !('PushManager' in window)) return;
    try {
        const sub = await Promise.race([
            swRegistration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlB64ToUint8('BKkGp6NtPNIQIzeOH7xRg7Mqio69rPGYhwteihB5DKrhnBbpmd-Sfi-qofhA_8GYpJdIJpMWogmQ9Bp6Zyj40Hk'),
            }),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000))
        ]);
        const raw = sub.toJSON();
        await api('/push/subscribe', { method: 'POST', body: JSON.stringify({ endpoint: raw.endpoint, keys: raw.keys }) });
        console.log('✅ Push 订阅成功');
    } catch (e) { console.warn('Push sub fail:', e.message); }
}

function urlB64ToUint8(base64) {
    const pad = '='.repeat((4 - (base64.length % 4)) % 4);
    const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return new Uint8Array([...raw].map(c => c.charCodeAt(0)));
}

async function requestPushPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') { permBanner.classList.add('hidden'); subscribePush(); return; }
    if (Notification.permission === 'denied') { permBanner.classList.remove('hidden'); permBtn.textContent = t('perm.denied'); permBtn.disabled = true; return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') { permBanner.classList.add('hidden'); subscribePush(); }
    else { permBanner.classList.remove('hidden'); }
}

// ---------- 数据加载 ----------
async function loadReminders() {
    const data = await api('/reminders');
    reminders = data.reminders;
    return reminders;
}

// ---------- CRUD ----------
async function addReminder(name, dosage, times, note, groupId, startDate, endDate) {
    const data = await api('/reminders', { method: 'POST', body: JSON.stringify({ name, dosage, times, note, groupId, startDate, endDate }) });
    reminders.unshift(data.reminder);
    render();
}

async function updateReminder(id, name, dosage, times, note, groupId, startDate, endDate) {
    const data = await api('/reminders/' + id, { method: 'PUT', body: JSON.stringify({ name, dosage, times, note, groupId, startDate, endDate }) });
    const idx = reminders.findIndex(r => r.id == id);
    if (idx !== -1) reminders[idx] = data.reminder;
    render();
}

async function deleteReminder(id) {
    await api('/reminders/' + id, { method: 'DELETE' });
    reminders = reminders.filter(r => r.id != id);
    if (activeNotifId) { const stillExists = reminders.some(r => r.times.some(t => t.id == activeNotifId)); if (!stillExists) hideInAppNotification(); }
    render();
}

async function toggleTaken(reminderId, timeId) {
    // 已服用状态下，点"已服用"要确认是否撤销
    const r = reminders.find(rem => rem.id == reminderId);
    const tm = r && r.times.find(t => t.id == timeId);
    if (tm && tm.taken && !confirm(t('reminder.untakeConfirm'))) return;

    const data = await api('/reminders/' + reminderId + '/times/' + timeId + '/toggle', { method: 'PATCH' });
    if (r) { const t = r.times.find(tm2 => tm2.id == timeId); if (t) { t.taken = data.time.taken; t.takenDate = data.time.takenDate; } }
    if (activeNotifId === timeId && data.time.taken) hideInAppNotification();
    render();
}

// ---------- 渲染 ----------
function isExpired(r) {
    if (!r.endDate) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    return new Date(r.endDate) < today;
}

function render() {
    const activeReminders = reminders.filter(r => !isExpired(r));
    let total = 0, taken = 0;
    activeReminders.forEach(r => { if (r.times) { r.times.forEach(tm => { total++; if (tm.taken) taken++; }); } });
    totalCount.textContent = total;
    takenCount.textContent = taken;
    dateBadge.textContent = formatDateDisplay();

    if (activeReminders.length === 0) {
        if (!token) {
            listContainer.innerHTML = '<div class="empty-state"><img src="logo.png" class="icon" style="width:56px;height:56px;border-radius:12px;"><h3>' + t('app.name') + '</h3><p>' + t('action.registerPrompt') + '</p><button id="emptyLoginBtn" style="margin-top:16px;padding:10px 36px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:15px;font-weight:600;letter-spacing:1px;box-shadow:0 3px 12px rgba(42,125,225,0.3);cursor:pointer;transition:all 0.25s">' + t('auth.loginBtn') + '</button><p style="margin-top:12px;font-size:13px;color:var(--gray);">' + t('auth.noAccount') + ' <a href="#" id="emptyRegLink" style="color:var(--primary);text-decoration:none;font-weight:500;">' + t('auth.toRegister') + '</a></p><p id="statsText" style="margin-top:16px;font-size:12px;color:var(--gray);opacity:0.6;"></p></div>';
            const emptyLoginBtn = document.getElementById('emptyLoginBtn');
            const emptyRegLink = document.getElementById('emptyRegLink');
            if (emptyLoginBtn) emptyLoginBtn.addEventListener('click', showAuthModal);
            if (emptyRegLink) emptyRegLink.addEventListener('click', (e) => { e.preventDefault(); showAuthMode(false); showAuthModal(); });
            loadStats();
        } else {
            listContainer.innerHTML = '<div class="empty-state"><img src="logo.png" class="icon" style="width:56px;height:56px;border-radius:12px;"><h3>' + t('empty.title') + '</h3><p>' + t('empty.desc') + '</p></div>';
        }
        return;
    }

    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const items = [];
    activeReminders.forEach(r => {
        if (r.times) {
            r.times.forEach(tm => {
                const mins = timeToMinutes(tm.time);
                items.push({ reminder: r, time: tm, minutes: mins, isTaken: tm.taken, isOverdue: !tm.taken && mins < currentMinutes });
            });
        }
    });
    items.sort((a, b) => { if (a.minutes !== b.minutes) return a.minutes - b.minutes; return a.reminder.name.localeCompare(b.reminder.name); });

    let html = '';
    items.forEach(item => {
        const r = item.reminder, tm = item.time, isTaken = item.isTaken, isOverdue = item.isOverdue;
        let cardClass = 'reminder-card';
        if (isTaken) cardClass += ' taken';
        if (isOverdue && !isTaken) cardClass += ' overdue';
        const dosageDisplay = r.dosage ? ' · ' + escapeHtml(r.dosage) : '';
        const noteDisplay = r.note ? '📌 ' + escapeHtml(r.note) : '';
        html += '<div class="' + cardClass + '" data-reminder-id="' + r.id + '" data-time-id="' + tm.id + '">' +
            '<div class="card-top"><div class="card-left"><div class="card-name">' +
            '<span class="drug-icon">💊</span>' + escapeHtml(r.name) +
            (dosageDisplay ? '<span class="card-dosage">' + dosageDisplay + '</span>' : '') +
            '</div></div><div class="card-time">' + tm.time + '</div></div>' + // just show time as-is
            (noteDisplay ? '<div class="card-note">' + noteDisplay + '</div>' : '') +
            '<div class="card-actions">' +
            '<button class="btn-take ' + (isTaken ? 'taken-btn' : '') + '" data-action="take">' + (isTaken ? t('reminder.taken') : t('reminder.take')) + '</button>' +
            '<button class="btn-delete" data-action="delete" aria-label="' + t('reminder.delete') + '">🗑</button></div></div>';
    });
    listContainer.innerHTML = html + '<div style="text-align:center;padding:24px 0 8px;color:var(--gray);font-size:13px;opacity:0.5;">' + t('list.end') + '</div>';

    listContainer.querySelectorAll('.reminder-card').forEach(card => {
        const remId = Number(card.dataset.reminderId), timeId = Number(card.dataset.timeId);
        // 点击卡片弹出编辑
        card.addEventListener('click', () => {
            const rem = reminders.find(r => r.id == remId);
            if (rem) openModal(rem);
        });
        card.style.cursor = 'pointer';
        card.querySelector('[data-action="take"]').addEventListener('click', (e) => { e.stopPropagation(); toggleTaken(remId, timeId); });
        card.querySelector('[data-action="delete"]').addEventListener('click', (e) => { e.stopPropagation(); if (confirm(t('reminder.deleteConfirm'))) deleteReminder(remId); });
    });
}

// ---------- 模态框 ----------
async function loadGroups() {
    if (!token) return;
    try {
        const data = await api('/groups');
        groups = data.groups;
        inputGroup.innerHTML = '<option value="">' + t('group.noGroup') + '</option>';
        groups.forEach(g => {
            inputGroup.innerHTML += '<option value="' + g.id + '">' + escapeHtml(g.name) + '</option>';
        });
    } catch(e) { groups = []; }
}
function openModal(editData = null) {
    loadGroups();
    if (editData) {
        editingId = editData.id;
        modalTitle.textContent = t('modal.editTitle');
        inputName.value = editData.name;
        parseDosage(editData.dosage || '');
        inputNote.value = editData.note || '';
        inputGroup.value = editData.groupId || '';
        inputStartDate.value = editData.startDate || '';
        inputEndDate.value = editData.endDate || '';
        renderTimeInputs(editData.times.map(t => t.time));
    } else {
        editingId = null;
        modalTitle.textContent = t('modal.addTitle');
        inputName.value = '';
        resetDosage();
        inputNote.value = '';
        inputGroup.value = '';
        inputStartDate.value = '';
        inputEndDate.value = '';
        renderTimeInputs(['08:00', '20:00']);
    }
    modalOverlay.classList.add('active');
    setTimeout(() => inputName.focus(), 100);
}

function closeModal() { modalOverlay.classList.remove('active'); editingId = null; }

function renderTimeInputs(times) {
    if (!times || times.length === 0) times = ['08:00'];
    timeList.innerHTML = '';
    times.forEach(val => {
        const div = document.createElement('div');
        div.className = 'time-item';
        div.innerHTML = '<input type="time" value="' + escapeHtml(val) + '" class="time-input" /><button class="remove-time" ' + (times.length <= 1 ? 'disabled style="opacity:0.3;"' : '') + '>✕</button>';
        timeList.appendChild(div);
        const removeBtn = div.querySelector('.remove-time');
        if (removeBtn && !removeBtn.disabled) {
            removeBtn.addEventListener('click', () => { if (timeList.children.length > 1) div.remove(); });
        }
    });
}

function getTimesFromInputs() {
    const inputs = timeList.querySelectorAll('.time-input');
    const times = [];
    inputs.forEach(inp => { const v = inp.value.trim(); if (v) times.push(v); });
    return [...new Set(times)];
}

async function handleSave() {
    const name = inputName.value.trim();
    if (!name) { alert(t('modal.drugRequired')); inputName.focus(); return; }
    const times = getTimesFromInputs();
    if (times.length === 0) { alert(t('modal.timeRequired')); return; }
    const dosage = composeDosage();
    const note = inputNote.value.trim();
    const groupId = inputGroup.value || null;
    const startDate = inputStartDate.value;
    const endDate = inputEndDate.value;
    try {
        if (editingId) { await updateReminder(editingId, name, dosage, times, note, groupId, startDate, endDate); }
        else { await addReminder(name, dosage, times, note, groupId, startDate, endDate); }
        closeModal();
    } catch (e) { alert(t('modal.saveError') + e.message); }
}

// ---------- 页面内通知 ----------
function showInAppNotification(title, body, reminderId, timeId) {
    if (activeNotifId === timeId) return;
    notifTitle.textContent = '⏰ ' + title;
    notifBody.textContent = body;
    inappNotif.classList.add('active');
    activeNotifId = timeId;
    inappNotif.dataset.reminderId = reminderId;
    inappNotif.dataset.timeId = timeId;
    if (notifTimeout) clearTimeout(notifTimeout);
}

function hideInAppNotification() {
    inappNotif.classList.remove('active'); activeNotifId = null;
    if (notifTimeout) { clearTimeout(notifTimeout); notifTimeout = null; }
}

// ---------- 轮询检查 ----------
async function checkReminders() {
    try { await loadReminders(); } catch (e) { return; }
    const now = new Date();
    const currentTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    reminders.forEach(r => {
        if (!r.times) return;
        r.times.forEach(tm => {
            if (tm.taken) return;
            if (tm.time === currentTime) {
                if (activeNotifId === tm.id) return;
                const dosage = r.dosage ? ' (' + r.dosage + ')' : '';
                const body = t('notif.doseTime') + dosage + (r.note ? '，' + r.note : '');
                showInAppNotification(r.name, body, r.id, tm.id);
                if (navigator.vibrate) navigator.vibrate(200);
            }
        });
    });
    render();
}

        }

});

// ---------- 分组管理 ----------
const groupsOverlay = document.getElementById('groupsOverlay');
const groupsCloseBtn = document.getElementById('groupsCloseBtn');
const groupsList = document.getElementById('groupsList');
const groupsAddBtn = document.getElementById('groupsAddBtn');
const groupForm = document.getElementById('groupForm');
const groupName = document.getElementById('groupName');
const groupStartDate = document.getElementById('groupStartDate');
const groupEndDate = document.getElementById('groupEndDate');
const groupNote = document.getElementById('groupNote');
const groupFormSave = document.getElementById('groupFormSave');
const groupFormCancel = document.getElementById('groupFormCancel');
let editingGroupId = null;

async function openGroups() {
    if (!token) { showAuthModal(); return; }
    await loadGroups();
    renderGroupList();
    groupForm.style.display = 'none';
    groupsOverlay.classList.remove('hidden');
    groupsOverlay.classList.add('active');
}

function renderGroupList() {
    if (groups.length === 0) {
        groupsList.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray);">' + t('groups.empty') + '</div>';
        return;
    }
    let html = '';
    groups.forEach(g => {
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-bottom:1px solid var(--gray-border);">';
        html += '<div><strong>' + escapeHtml(g.name) + '</strong> <span style="color:var(--gray);font-size:12px;">(' + t('groups.count', {n: g.medCount}) + ')</span>';
        if (g.startDate || g.endDate) html += '<br><span style="font-size:11px;color:var(--gray);">' + (g.startDate||'?') + ' ~ ' + (g.endDate||'?') + '</span>';
        if (g.note) html += '<br><span style="font-size:11px;color:var(--gray);">' + escapeHtml(g.note) + '</span>';
        html += '</div>';
        html += '<div style="display:flex;gap:4px;">';
        html += '<button onclick="editGroup(' + g.id + ')" style="font-size:12px;padding:2px 8px;border:1px solid var(--gray-border);border-radius:6px;background:none;cursor:pointer;">' + t('groups.edit') + '</button>';
        html += '<button onclick="deleteGroup(' + g.id + ')" style="font-size:12px;padding:2px 8px;border:1px solid var(--danger);color:var(--danger);border-radius:6px;background:none;cursor:pointer;">' + t('groups.delete') + '</button>';
        html += '</div></div>';
    });
    groupsList.innerHTML = html;
}

function showGroupForm(editData = null) {
    if (editData) {
        editingGroupId = editData.id;
        groupName.value = editData.name;
        groupStartDate.value = editData.startDate || '';
        groupEndDate.value = editData.endDate || '';
        groupNote.value = editData.note || '';
        groupFormSave.textContent = t('groups.update');
    } else {
        editingGroupId = null;
        groupName.value = '';
        groupStartDate.value = '';
        groupEndDate.value = '';
        groupNote.value = '';
        groupFormSave.textContent = t('groups.save');
    }
    groupForm.style.display = 'block';
    groupsAddBtn.style.display = 'none';
    setTimeout(() => groupName.focus(), 100);
}

function hideGroupForm() {
    groupForm.style.display = 'none';
    groupsAddBtn.style.display = '';
    editingGroupId = null;
}

groupFormSave.addEventListener('click', async () => {
    const name = groupName.value.trim();
    if (!name) { alert(t('groups.nameRequired')); return; }
    try {
        if (editingGroupId) {
            await api('/groups/' + editingGroupId, { method: 'PUT', body: JSON.stringify({
                name, startDate: groupStartDate.value, endDate: groupEndDate.value, note: groupNote.value.trim()
            })});
        } else {
            await api('/groups', { method: 'POST', body: JSON.stringify({
                name, startDate: groupStartDate.value, endDate: groupEndDate.value, note: groupNote.value.trim()
            })});
        }
        await loadGroups();
        renderGroupList();
        hideGroupForm();
    } catch(e) { alert('保存失败: ' + e.message); }
});

groupFormCancel.addEventListener('click', hideGroupForm);
groupsAddBtn.addEventListener('click', () => showGroupForm());
groupsCloseBtn.addEventListener('click', () => { groupsOverlay.classList.remove('active'); groupsOverlay.classList.add('hidden'); });
groupsOverlay.addEventListener('click', (e) => { if (e.target === groupsOverlay) { groupsOverlay.classList.remove('active'); groupsOverlay.classList.add('hidden'); } });

document.getElementById('bottomGroupsBtn').addEventListener('click', openGroups);

window.editGroup = function(id) {
    const g = groups.find(x => x.id === id);
    if (g) showGroupForm(g);
};
window.deleteGroup = async function(id) {
    if (!confirm(t('groups.deleteConfirm'))) return;
    try {
        await api('/groups/' + id, { method: 'DELETE' });
        await loadGroups();
        renderGroupList();
    } catch(e) { alert('删除失败: ' + e.message); }
};

        });

        else { pwdMsg.textContent = data.error; pwdMsg.style.color = 'var(--danger)'; }

// 显示推送订阅状态
async function showPushStatus(silent = true) {
    if (!('serviceWorker' in navigator)) return 'unsupported';
    try {
        const reg = await Promise.race([
            navigator.serviceWorker.getRegistration(),
            new Promise((_, r) => setTimeout(() => r(new Error('t')), 5000))
        ]);
        if (!reg) return 'no_sw';
        const sub = await Promise.race([
            reg.pushManager.getSubscription(),
            new Promise((_, r) => setTimeout(() => r(new Error('t')), 5000))
        ]);
        if (sub) return 'subscribed';
        return 'not_subscribed';
    } catch(e) { return 'timeout'; }
}

}

function updateBottomBarAuth() {

}
async function bootstrap() {
    loadStats();
    await registerSW();
    // 始终显示 app 主界面
    app.classList.remove('hidden');
    if (loadToken()) {
        userRole = localStorage.getItem('sig_role') || 'user';
        try {
            const data = await api('/reminders');
            reminders = data.reminders;
            if (userRole === 'admin') { if (sheetAdminBtn) sheetAdminBtn.classList.remove('hidden'); }
            updateBottomBarAuth();
            await initApp();
            return;
        } catch (e) { logout(); }
    }
    // 未登录：显示空列表
    updateBottomBarAuth();
    refreshUI();
    // 监听通知权限（未登录也提示）
    if ('Notification' in window && Notification.permission === 'default') {
        permBanner.classList.remove('hidden');
    }
}

// 语言切换时重新渲染
function refreshUI() {
    loadStats();
    showAuthMode(isLoginMode);
    // 静态占位符
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder || '');
    });
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    const disc = document.getElementById('disclaimerText');
    if (disc) disc.textContent = t('disclaimerShort');
    const permText = document.getElementById('permBanner');
    if (permText && permText.querySelector('span')) permText.querySelector('span').textContent = t('perm.banner');
    const addTime = document.getElementById('addTimeBtn');
    if (addTime) addTime.textContent = t('modal.addTime');
    // Notif static
    const notifTitleEl = document.getElementById('notifTitle');
    if (notifTitleEl) notifTitleEl.textContent = t('notif.title');
    const notifBodyEl = document.getElementById('notifBody');
    if (notifBodyEl) notifBodyEl.textContent = t('notif.body');
    const notifTakeEl = document.getElementById('notifTakeBtn');
    if (notifTakeEl) notifTakeEl.textContent = t('notif.takeNow');
    const notifDismissEl = document.getElementById('notifDismissBtn');
    if (notifDismissEl) notifDismissEl.textContent = t('notif.dismiss');
    const appTitle = document.getElementById('appTitle');
    if (appTitle) appTitle.textContent = t('app.name');
    const logoutBtnEl = document.getElementById('logoutBtn');
    // logout button is now icon 🚪, no text update needed
    const labelTotal = document.getElementById('labelTotalMeds');
    if (labelTotal) labelTotal.textContent = t('header.todayMeds');
    const labelTaken = document.getElementById('labelTaken');
    if (labelTaken) labelTaken.textContent = t('header.taken');
    const permBtnEl = document.getElementById('permBtn');
    if (permBtnEl) {
        if ('Notification' in window && Notification.permission === 'denied') permBtnEl.textContent = t('perm.denied');
        else permBtnEl.textContent = t('perm.enable');
    }
    document.title = t('app.name');
    // 语言选择器同步
    const langSel = document.getElementById('langSelect');
    if (langSel) langSel.value = window.i18nCurrent();
    if (!authOverlay.classList.contains('active')) render();
}
